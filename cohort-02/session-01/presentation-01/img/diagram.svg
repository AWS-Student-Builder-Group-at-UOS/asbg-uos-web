<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">From edited files to a shared record</title>
  <desc id="desc">Working directory to staging with git add, to local history with git commit, and to a remote with git push. Diff compares the relevant states.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#1160D8" stroke-width="1.7"/></marker></defs>
  <rect width="1200" height="600" fill="#F7FBFF"/>
  <rect x="1" y="1" width="1198" height="598" fill="none" stroke="#C6D9EB" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="58" fill="#0B0F17" font-size="30" font-weight="700">Choose a change. Keep a record. Then share it.</text>
    <text x="44" y="91" fill="#526479" font-size="19">Three local states, followed by a separate remote step.</text>
    <rect x="30" y="133" width="839" height="256" fill="#EAF4FE" stroke="#C6D9EB"/>
    <text x="49" y="164" fill="#1160D8" font-size="15" font-weight="700" letter-spacing="2">ON YOUR LAPTOP</text>
    <g fill="#FFFFFF" stroke="#42B4FF" stroke-width="2">
      <rect x="49" y="191" width="220" height="145"/>
      <rect x="340" y="191" width="220" height="145"/>
      <rect x="631" y="191" width="220" height="145"/>
    </g>
    <rect x="935" y="191" width="220" height="145" fill="#1160D8"/>
    <g fill="#0B0F17" text-anchor="middle">
      <text x="159" y="234" font-size="22" font-weight="700">Working directory</text>
      <text x="450" y="234" font-size="22" font-weight="700">Staging area</text>
      <text x="741" y="234" font-size="22" font-weight="700">Local history</text>
    </g>
    <text x="1045" y="234" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">Remote repository</text>
    <g fill="#526479" text-anchor="middle" font-size="18">
      <text x="159" y="273">Files you are editing</text><text x="159" y="302">Save in your editor</text>
      <text x="450" y="273">Selected content</text><text x="450" y="302">for the next commit</text>
      <text x="741" y="273">Recorded snapshots</text><text x="741" y="302">on the current branch</text>
    </g>
    <g fill="#E4F2FF" text-anchor="middle" font-size="18"><text x="1045" y="273">Shared history</text><text x="1045" y="302">at a checked destination</text></g>
    <g fill="none" stroke="#1160D8" stroke-width="2.5" marker-end="url(#arrow)"><path d="M274 264H331"/><path d="M565 264H622"/><path d="M856 264H926"/></g>
    <g fill="#1160D8" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18">
      <text x="303" y="367">git add</text><text x="594" y="367">git commit</text><text x="894" y="367">git push</text>
    </g>
    <path d="M159 413V429H450V413" fill="none" stroke="#1160D8" stroke-width="2"/>
    <path d="M450 462V479H741V462" fill="none" stroke="#1160D8" stroke-width="2"/>
    <text x="305" y="456" fill="#1160D8" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20">git diff</text>
    <text x="596" y="507" fill="#1160D8" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20">git diff --staged</text>
    <text x="45" y="563" fill="#526479" font-size="18">Edited again after staging? Review the new change and run git add again if it belongs in this commit.</text>
  </g>
</svg>
