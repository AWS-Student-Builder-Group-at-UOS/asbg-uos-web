    ko: "백엔드를 공부하고 있고, 요즘은 AI와 인프라에도 관심이 생겨 조금씩 접해 보는 중입니다. AWS와 인프라를 제대로 배워서 실제로 어떻게 쓰이는지까지 알아가고 싶습니다. 맛집 다니는 걸 좋아하고, 디저트가 좋아서 베이킹도 조금씩 합니다."
