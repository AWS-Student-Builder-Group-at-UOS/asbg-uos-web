- id: kang-eunjung
  name: { ko: 강은중, en: Eunjung Kang }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/kang-eunjung.jpg
  links:
    github: https://github.com/7lyomi
  keywords: [Networking, Economics, Cats]
  description:
    ko: "잠들기 전에 창문을 열고 별들에게 출석을 불러요. 대답이 없으면 먼저 잔 걸로, 구름에 가려지면 이불을 덮은 걸로 처리합니다. 지각한 작은 별에게 따뜻한 우유를 줬는데 컵을 돌려줄 생각이 없나 봐요. 밤하늘에서 우유 냄새가 나면 그 친구가 또 한 잔 마시고 있구나 해주세요 ㅎㅎ."
    en: "Before bed, I open my window and take attendance for the stars. The quiet ones are asleep, and those behind clouds have pulled up their blankets. I gave a late little star some warm milk, but it seems to be keeping my cup. If the night sky smells of milk, that's probably my friend helping itself to another serving."

- id: kim-gyutae
  name: { ko: 김규태, en: Gyutae Kim }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/kim-gyutae.jpg
  links:
    github: https://github.com/kanggregorics03
  keywords: [Backend, AWS, Keyboards]
  description:
    ko: "상추 지붕을 얹은 달팽이 전용 택시를 운영해요. 요금은 오이 한 조각인데 단골들은 자꾸 한 입 베어 먹은 걸 주고 갑니다. 비가 오면 손님들이 신나서 걸어가는 바람에 저는 빈 택시를 끌고 따라가요. 조금 늦어도 풀 한 포기까지 느긋하게 구경하며 골목 끝 민들레까지 함께 가실 분을 기다립니다."
    en: "I run a snail taxi with a lettuce-leaf roof. The fare is one cucumber slice, though my regulars keep paying with nibbled ones. When it rains, the passengers happily walk instead, leaving me to pull the empty taxi behind them. Come along to the dandelion at the end of the lane, with plenty of time to admire every blade of grass."

- id: wi-jaebok
  name: { ko: 위재복, en: Jaebok Wi }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/wi-jaebok.jpg
  links:
    github: https://github.com/jaebok1211
  keywords: ["Data Analysis", Cloud, Bread]
  description:
    ko: "양말 한 짝이 사라지면 세탁기 뒤 작은 나라로 모험을 떠났다고 생각해요. 남은 한 짝과 창가에서 구름을 보며 기다리는데, 아직 편지가 없는 걸 보니 먼지 토끼를 타고 솜사탕 산을 넘느라 바쁜가 봅니다. 기념품은 없어도 발뒤꿈치에 구멍만 안 나면 좋겠어요. 다음 여행에는 저도 꼭 데려가 달라고 부탁할 거예요."
    en: "When a sock disappears, I imagine it's exploring a tiny kingdom behind the washing machine. Its partner and I watch clouds by the window, waiting for a letter while it rides a dust bunny over cotton-candy mountains. I don't need souvenirs, as long as it comes home without a hole in its heel. Next time, I'll ask it to take me along."

- id: jeong-jiyun
  name: { ko: 정지윤, en: Jiyun Jeong }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/jeong-jiyun.jpg
  links:
    github: https://github.com/jiyun5826
  keywords: [Backend, Infra, Baking]
  description:
    ko: "책갈피로 쓸 낙엽을 모으다 낙엽 전용 책장의 관리인이 됐어요. 노란 잎은 햇볕 드는 위층을 좋아하고, 빨간 잎들은 서로 예쁘다고 밤늦게까지 바스락거립니다. 바람이 불면 다 같이 산책을 나가 버려서 빈 책장에 대고 귀가 방송을 해요. 월세는 가을 냄새 한 줌이니 마음에 드는 낙엽을 만나면 소개해 주세요."
    en: "I collected leaves for bookmarks and somehow became the caretaker of their bookshelf. Yellow leaves like the sunny top shelf, while red ones rustle late into the night, praising each other's colors. When the wind takes everyone out for a walk, I call for them to come home to the empty shelves. Rent is a handful of autumn air, so please introduce me to any lovely leaves you meet."
