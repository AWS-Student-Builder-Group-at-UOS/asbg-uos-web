- id: son-subin
  name: { ko: 손수빈, en: Subin Son }
  role: Leader
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/son-subin.jpg
  links:
    github: https://github.com/ssub17
  keywords: [Kubernetes, Networking, "Animal Crossing"]
  description:
    ko: "폭신한 구름을 발견하면 베개로 데려올 방법부터 고민합니다. 창가에 베갯잇을 펼쳐 뒀는데 아직 구름은 없고 바람만 잠깐 쉬었다 가네요 ㅎㅎ. 비 오는 날에는 구름이 목욕 중이라고 생각해서 수건도 한 장 챙겨 둡니다. 언젠가 작은 구름이 이사 오면 뭉실이라고 부르고, 간식으로 수증기를 좋아하는지 물어볼 거예요."
    en: "Whenever I spot a fluffy cloud, I wonder how to bring it home as a pillow. I've left a pillowcase by the window, but so far only the breeze has stopped by for a rest. On rainy days, I assume the clouds are having a bath, so I keep a towel ready. If a little cloud moves in, I'll call it Puff and ask whether it likes steam for snacks."

- id: hwang-sujin
  name: { ko: 황수진, en: Sujin Hwang }
  role: Tech Lead
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/hwang-sujin.jpg
  links:
    github: https://github.com/abroniasj416
  keywords: [Linux, Container, Lizards]
  description:
    ko: "산책하다 만난 돌멩이에게 이름과 작은 직업을 지어 줍니다. 오늘 만난 감자 3호는 햇볕 드는 자리에서 낮잠을 관리하는 친구예요. 휴가도 필요할 것 같아서 물웅덩이를 바닷가라고 소개하고, 옆에서 작게 철썩 소리를 내 줬습니다. 여행 사진도 찍어 줬는데 다들 표정이 한결같아서 누가 가장 즐거웠는지는 아직 모르겠어요."
    en: "I give the pebbles I meet on walks names and little jobs. Today's friend, Potato No. 3, supervises naps in sunny spots. I figured they needed a holiday, so I called a puddle the seaside and made tiny splashing sounds for them. I took holiday photos too, but everyone kept making the same face, so I still can't tell who had the most fun."

- id: lee-yena
  name: { ko: 이예나, en: Yena Lee }
  role: Tech Lead
  major: { ko: 전자전기컴퓨터공학부, en: Electrical and Computer Engineering }
  photo: img/lee-yena.jpg
  links:
    github: https://github.com/i2na
    website: http://yena.io.kr/
  keywords: [Serverless, Container, Cats]
  description:
    ko: "귤껍질로 오리 모자를 만드는 조그만 가게를 상상하고 있습니다. 아직 손님은 없지만 동그란 모자부터 그냥 귤껍질처럼 보이는 모자까지 준비했어요. 마음에 들면 꽥 소리를 한 번, 아주 마음에 들면 두 번 내 주면 됩니다. 모자보다 귤을 더 좋아하는 손님도 있을 것 같아서 계산대 옆에는 작은 귤 접시를 놓을 거예요 ㅎㅎ."
    en: "I'm imagining a tiny shop that makes hats for ducks out of tangerine peels. No customers yet, but I've prepared everything from round hats to ones that still look like plain peels. Ducks can quack once if they like the fit and twice if they love it. Some might prefer the fruit to the hats, so I'll keep a little plate of tangerines beside the till."

- id: lee-chaewoo
  name: { ko: 이채우, en: Chaewoo Lee }
  role: Director of Events
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/lee-chaewoo.jpg
  links:
    github: https://github.com/2fill
  keywords: [Frontend, "Medical AI", Dance]
  description:
    ko: "비가 오면 장화 신은 참새들이 물웅덩이에서 노는 모습을 상상합니다. 발이 작으니까 도토리 껍질로 장화를 만들고, 우산 대신 작은 나뭇잎을 얹어 주면 어떨까요. 맑은 날에는 장화를 창가에 나란히 말려 놓고 참새들과 날씨 이야기를 하고 싶어요. 다람쥐가 도토리 가게인 줄 알고 찾아올까 봐 진짜 도토리도 몇 알 준비해 둡니다."
    en: "When it rains, I imagine sparrows splashing in puddles in little boots. Perhaps acorn caps could fit their feet, with tiny leaves on their heads instead of umbrellas. On sunny days, I'd dry their boots by the window and chat about the weather with everyone. I keep a few real acorns ready too, in case a squirrel mistakes the place for an acorn shop."

- id: jang-jiwon
  name: { ko: 장지원, en: Jiwon Jang }
  role: Director of Marketing
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/jang-jiwon.jpg
  links:
    github: https://github.com/uukdo
  keywords: [DevOps, Startup, Doraemon]
  description:
    ko: "연필들이 심심할까 봐 필통에 꼭 둘씩 넣어 다닙니다. 지우개가 지난 이야기를 지워 버릴까 봐 일기장은 제가 따로 맡아 두었어요. 짧아진 연필은 은퇴한 선생님처럼 작은 상자에 모셔 두고 가끔 조언을 구하는데, 대답은 없어도 생각은 꽤 날카로울 것 같습니다. 언젠가 이 친구들이 회의를 열면 저는 조용히 종이만 가져다줄 거예요."
    en: "I carry my pencils in pairs so they won't get lonely. I keep their diary elsewhere in case the eraser rubs out all the old stories. Retired pencils get little boxes of their own, and although they never answer when I ask for advice, I'm sure they have some sharp ideas. If they ever hold a meeting, I'll quietly bring them some paper."
