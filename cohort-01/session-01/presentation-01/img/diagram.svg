<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="한 학기 동안 서비스 하나를 키워 가는 흐름: 서버 구성, 서버리스 분리, 배포 자동화, 종합 점검">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="320" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="318" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="48" font-size="26" font-weight="700" fill="#123249">한 학기, 서비스 하나</text>
<text x="36" y="78" font-size="16" fill="#35526A">서버 한 대를 잘 운영하는 문제에서, 기능 단위로 나누고 자동으로 배포하는 문제로</text>

<!-- 1 -->
<rect x="36" y="118" width="195" height="120" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="54" y="146" font-size="12" font-weight="700" fill="#1160D8">01</text>
<text x="54" y="176" font-size="18" font-weight="700" fill="#123249">서버 구성</text>
<text x="54" y="200" font-size="13" fill="#123249">VPC · EC2 · ALB · RDS</text>
<text x="54" y="222" font-size="12" fill="#35526A">3-Tier 구조</text>
<line x1="237" y1="178" x2="261" y2="178" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 2 -->
<rect x="267" y="118" width="195" height="120" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="285" y="146" font-size="12" font-weight="700" fill="#1160D8">02</text>
<text x="285" y="176" font-size="18" font-weight="700" fill="#123249">서버리스 분리</text>
<text x="285" y="200" font-size="13" fill="#123249">Lambda · DynamoDB · SQS</text>
<text x="285" y="222" font-size="12" fill="#35526A">이벤트 기반</text>
<line x1="468" y1="178" x2="492" y2="178" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 3 -->
<rect x="498" y="118" width="195" height="120" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="516" y="146" font-size="12" font-weight="700" fill="#1160D8">03</text>
<text x="516" y="176" font-size="18" font-weight="700" fill="#123249">배포 자동화</text>
<text x="516" y="200" font-size="13" fill="#123249">ECS · ECR · CodePipeline</text>
<text x="516" y="222" font-size="12" fill="#35526A">컨테이너 · CI/CD</text>
<line x1="699" y1="178" x2="723" y2="178" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 4 -->
<rect x="729" y="118" width="195" height="120" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="747" y="146" font-size="12" font-weight="700" fill="#1160D8">04</text>
<text x="747" y="176" font-size="18" font-weight="700" fill="#123249">종합 점검</text>
<text x="747" y="200" font-size="13" fill="#123249">SAA 문제 바탕</text>
<text x="747" y="222" font-size="12" fill="#35526A">학기 마지막</text>

<text x="36" y="286" font-size="14" fill="#35526A">각 세션은 앞 세션에서 만든 서비스에 새 구성 요소를 이어 붙입니다</text>
</g>
</svg>
