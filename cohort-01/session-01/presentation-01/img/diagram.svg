<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Five sessions from kickoff to review, one service taking shape along the way">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="440" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="438" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="26" font-weight="700" fill="#123249">다섯 번의 세션, 하나로 이어지는 흐름</text>
<text x="36" y="76" font-size="17" fill="#35526A">네트워크와 서버 → 서버리스와 이벤트 → 컨테이너와 자동 배포</text>

<line x1="100" y1="230" x2="860" y2="230" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>

<!-- node 1: 9/8 (above) -->
<line x1="100" y1="230" x2="100" y2="194" stroke="#79CDFF" stroke-width="2"/>
<circle cx="100" cy="230" r="9" fill="#1160D8"/>
<rect x="5" y="118" width="190" height="76" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="100" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#1160D8">9/8</text>
<text x="100" y="174" text-anchor="middle" font-size="15" fill="#123249">킥오프</text>

<!-- node 2: 9/29 (below) -->
<line x1="290" y1="230" x2="290" y2="266" stroke="#79CDFF" stroke-width="2"/>
<circle cx="290" cy="230" r="9" fill="#1160D8"/>
<rect x="195" y="266" width="190" height="76" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="290" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#1160D8">9/29</text>
<text x="290" y="322" text-anchor="middle" font-size="14" fill="#123249">VPC·EC2·ALB·RDS</text>

<!-- node 3: 11/3 (above) -->
<line x1="480" y1="230" x2="480" y2="194" stroke="#79CDFF" stroke-width="2"/>
<circle cx="480" cy="230" r="9" fill="#1160D8"/>
<rect x="385" y="118" width="190" height="76" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="480" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#1160D8">11/3</text>
<text x="480" y="174" text-anchor="middle" font-size="14" fill="#123249">Lambda·DynamoDB·SQS</text>

<!-- node 4: 11/24 (below) -->
<line x1="670" y1="230" x2="670" y2="266" stroke="#79CDFF" stroke-width="2"/>
<circle cx="670" cy="230" r="9" fill="#1160D8"/>
<rect x="575" y="266" width="190" height="76" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="670" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#1160D8">11/24</text>
<text x="670" y="322" text-anchor="middle" font-size="14" fill="#123249">ECS·ECR·CodePipeline</text>

<!-- node 5: 12/29 (above) -->
<line x1="860" y1="230" x2="860" y2="194" stroke="#79CDFF" stroke-width="2"/>
<circle cx="860" cy="230" r="9" fill="#1160D8"/>
<rect x="765" y="118" width="190" height="76" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="860" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#1160D8">12/29</text>
<text x="860" y="174" text-anchor="middle" font-size="15" fill="#123249">종합 점검</text>

<text x="36" y="396" font-size="18" font-weight="700" fill="#123249">서버 한 대를 잘 운영하는 문제에서, 작은 기능 단위로 나누고 자동으로 배포하는 문제로</text>
<text x="36" y="419" font-size="14" fill="#35526A">각 세션은 이전 세션에서 만든 서비스에 새 구성 요소를 이어 붙이는 방식으로 진행됩니다</text>
</g>
</svg>
