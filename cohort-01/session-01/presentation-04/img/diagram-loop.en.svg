<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="The digital twin loop and the four layers that make it up">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="420" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="418" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="22" font-weight="700" fill="#123249">Replicate reality, then analyze, predict and control: one loop</text>
<text x="36" y="74" font-size="15" fill="#35526A">Not a new technology, a collection of existing ones</text>

<rect x="60" y="120" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="160" y="142" text-anchor="middle" font-size="11" fill="#35526A">Real</text>
<text x="160" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">Building · Sensors</text>

<rect x="340" y="120" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="440" y="142" text-anchor="middle" font-size="11" fill="#35526A">Virtual</text>
<text x="440" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">3D replica</text>

<rect x="340" y="280" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="440" y="302" text-anchor="middle" font-size="11" fill="#35526A">AI</text>
<text x="440" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">Analyze · Predict</text>

<rect x="60" y="280" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="160" y="302" text-anchor="middle" font-size="11" fill="#35526A">Control</text>
<text x="160" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">Equipment commands</text>

<line x1="266" y1="152" x2="334" y2="152" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="440" y1="190" x2="440" y2="274" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="334" y1="312" x2="266" y2="312" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="160" y1="274" x2="160" y2="190" stroke="#1160D8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="172" y="237" font-size="12" fill="#1160D8">data again</text>

<text x="60" y="384" font-size="13" fill="#35526A">Closed loop: the result feeds back in as input, and the system improves itself</text>

<text x="600" y="130" font-size="12" fill="#35526A">The layers that make up the loop</text>
<rect x="600" y="142" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="142" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">Front-end · Show</text>
<rect x="600" y="202" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="202" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">Back-end · Collect</text>
<rect x="600" y="262" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="262" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">Infrastructure · Run</text>
<rect x="600" y="322" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="322" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">AI · Predict</text>
<text x="600" y="398" font-size="14" font-weight="700" fill="#1160D8">One hole → the whole loop stops</text>
</g>
</svg>
