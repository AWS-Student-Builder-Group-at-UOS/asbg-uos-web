<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="The digital twin loop and the four layers that make it up">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="300" fill="#FFFFFF"/>
<rect x="32" y="40" width="176" height="62" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="120" y="66.58" font-size="12.5" font-weight="500" fill="#8A94A0" text-anchor="middle">Real</text>
<text x="120" y="84.67" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Building and sensors</text>
<rect x="256" y="40" width="176" height="62" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="344" y="66.58" font-size="12.5" font-weight="500" fill="#8A94A0" text-anchor="middle">Virtual</text>
<text x="344" y="84.67" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">3D replica</text>
<rect x="256" y="200" width="176" height="62" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="344" y="226.57" font-size="12.5" font-weight="500" fill="#8A94A0" text-anchor="middle">AI</text>
<text x="344" y="244.67" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Analyze and predict</text>
<rect x="32" y="200" width="176" height="62" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="120" y="226.57" font-size="12.5" font-weight="500" fill="#8A94A0" text-anchor="middle">Control</text>
<text x="120" y="244.67" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Equipment commands</text>
<path d="M208 71L249.5 71" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M256 71L248.5 74.75L248.5 67.25Z" fill="#5B6470"/>
<path d="M344 102L344 193.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M344 200L340.25 192.5L347.75 192.5Z" fill="#5B6470"/>
<path d="M256 231L214.5 231" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M208 231L215.5 227.25L215.5 234.75Z" fill="#5B6470"/>
<path d="M120 200L120 108.5" fill="none" stroke="#1160D8" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M120 102L123.75 109.5L116.25 109.5Z" fill="#1160D8"/>
<text x="110" y="156" font-size="13.5" fill="#1160D8" text-anchor="end">data again</text>
<text x="232" y="143" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">Closed loop</text>
<text x="232" y="165" font-size="13" fill="#5B6470" text-anchor="middle">results feed</text>
<text x="232" y="184" font-size="13" fill="#5B6470" text-anchor="middle">back in as input</text>
<text x="480" y="52" font-size="13.5" fill="#5B6470">Layers that make up the loop</text>
<path d="M480 66L768 66" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="480" y="94" font-size="15" font-weight="600" fill="#0B0F17">Front-end</text>
<text x="768" y="94" font-size="14" fill="#5B6470" text-anchor="end">shows</text>
<path d="M480 110L768 110" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="480" y="138" font-size="15" font-weight="600" fill="#0B0F17">Back-end</text>
<text x="768" y="138" font-size="14" fill="#5B6470" text-anchor="end">collects</text>
<path d="M480 154L768 154" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="480" y="182" font-size="15" font-weight="600" fill="#0B0F17">Infrastructure</text>
<text x="768" y="182" font-size="14" fill="#5B6470" text-anchor="end">runs</text>
<path d="M480 198L768 198" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="480" y="226" font-size="15" font-weight="600" fill="#0B0F17">AI</text>
<text x="768" y="226" font-size="14" fill="#5B6470" text-anchor="end">predicts</text>
<path d="M480 242L768 242" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="480" y="272" font-size="13.5" fill="#2B323B">If one stops, the whole loop stops</text>
</svg>
