<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="디지털트윈 루프와 루프를 이루는 네 레이어">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="420" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="418" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">현실을 가상에 복제하고, 분석·예측·제어까지 하나의 루프로</text>
<text x="36" y="74" font-size="15" fill="#35526A">새 기술이 아니라 있는 기술의 집약체</text>

<rect x="60" y="120" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="160" y="142" text-anchor="middle" font-size="11" fill="#35526A">현실</text>
<text x="160" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">건물 · 센서</text>

<rect x="340" y="120" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="440" y="142" text-anchor="middle" font-size="11" fill="#35526A">가상</text>
<text x="440" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">3D 복제</text>

<rect x="340" y="280" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="440" y="302" text-anchor="middle" font-size="11" fill="#35526A">AI</text>
<text x="440" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">분석 · 예측</text>

<rect x="60" y="280" width="200" height="64" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="160" y="302" text-anchor="middle" font-size="11" fill="#35526A">제어</text>
<text x="160" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#123249">설비 명령</text>

<line x1="266" y1="152" x2="334" y2="152" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="440" y1="190" x2="440" y2="274" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="334" y1="312" x2="266" y2="312" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="160" y1="274" x2="160" y2="190" stroke="#1160D8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="172" y="237" font-size="12" fill="#1160D8">다시 데이터</text>

<text x="60" y="384" font-size="13" fill="#35526A">폐루프 · 결과가 다시 입력으로 들어와 스스로 나아지는 구조</text>

<text x="600" y="130" font-size="12" fill="#35526A">루프를 이루는 레이어</text>
<rect x="600" y="142" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="142" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">프론트 · 보여주기</text>
<rect x="600" y="202" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="202" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">백엔드 · 모으기</text>
<rect x="600" y="262" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="262" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">인프라 · 돌리기</text>
<rect x="600" y="322" width="320" height="48" fill="#FFFFFF" stroke="#79CDFF"/><rect x="600" y="322" width="6" height="48" fill="#79CDFF"/>
<text x="763" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">AI · 예측하기</text>
<text x="600" y="398" font-size="14" font-weight="700" fill="#1160D8">구멍 하나 → 루프 전체 정지</text>
</g>
