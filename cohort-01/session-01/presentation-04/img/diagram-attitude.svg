<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="시작은 AI로, 끝은 내가: 사람이 스펙과 테스트를 쓰고, AI가 구현하고, 자동 테스트가 피드백을 돌리고, 사람이 검증하고 책임진다">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="360" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="358" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">시작은 AI로, 끝은 내가</text>
<text x="36" y="74" font-size="15" fill="#35526A">사람의 일 = 루프 설계 + 검문소 배치</text>

<rect x="50" y="110" width="230" height="60" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="165" y="131" text-anchor="middle" font-size="11" fill="#35526A">사람</text>
<text x="165" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">스펙 · 테스트</text>

<rect x="330" y="110" width="230" height="60" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="445" y="131" text-anchor="middle" font-size="11" fill="#35526A">AI</text>
<text x="445" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">구현</text>

<rect x="330" y="250" width="230" height="60" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="445" y="271" text-anchor="middle" font-size="11" fill="#35526A">자동</text>
<text x="445" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">테스트 실패 · 피드백</text>

<rect x="50" y="250" width="230" height="60" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="165" y="271" text-anchor="middle" font-size="11" fill="#35526A">사람</text>
<text x="165" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#123249">검증 · 책임</text>

<line x1="286" y1="140" x2="324" y2="140" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="460" y1="176" x2="460" y2="244" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="430" y1="244" x2="430" y2="176" stroke="#79CDFF" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="472" y="214" font-size="11" fill="#35526A">자는 동안 반복</text>
<line x1="324" y1="280" x2="286" y2="280" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="165" y1="244" x2="165" y2="176" stroke="#1160D8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="177" y="214" font-size="12" fill="#1160D8">다음 스펙</text>

<rect x="600" y="146" width="14" height="14" fill="#79CDFF"/>
<text x="624" y="158" font-size="14" font-weight="700" fill="#123249">열어 두는 곳</text>
<text x="624" y="178" font-size="12" fill="#35526A">반복 · 초안 · 테스트 · 문서</text>
<rect x="600" y="226" width="14" height="14" fill="#123249"/>
<text x="624" y="238" font-size="14" font-weight="700" fill="#123249">잠그는 곳</text>
<text x="624" y="258" font-size="12" fill="#35526A">사용자 데이터 · 결제 · 배포 · 보안 · 큰 구조 변경</text>

<text x="50" y="338" font-size="13" fill="#35526A">열어 둔 곳은 AI가 반복하고, 잠근 곳은 사람이 승인한다</text>
</g>
</svg>
