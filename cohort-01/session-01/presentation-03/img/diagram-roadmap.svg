<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="클라우드 엔지니어가 알아야 할 다섯 단계: 기본기, 구축, 운영, 자동화, 컨테이너">
<rect width="960" height="340" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="338" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
