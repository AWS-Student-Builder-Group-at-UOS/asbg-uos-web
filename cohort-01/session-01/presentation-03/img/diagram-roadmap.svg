<text x="36" y="74" font-size="15" fill="#35526A">순서대로 다섯 단계</text>
<rect x="36" y="210" width="170" height="100" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="48" y="236" font-size="11" font-weight="700" fill="#1160D8">01</text>
