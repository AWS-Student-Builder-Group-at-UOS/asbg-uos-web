<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" role="img" aria-label="클라우드 엔지니어가 알아야 할 다섯 단계: 기본기, 구축, 운영, 자동화, 컨테이너">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-mono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="255" fill="#FFFFFF"/>
<path d="M32 40L768 40" fill="none" stroke="#C5CCD4" stroke-width="1.25"/>
<rect x="32" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="32" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">1</tspan>  <tspan font-weight="600" fill="#0B0F17">기본기</tspan></text>
<text x="32" y="106" font-size="13.5" fill="#5B6470">서버와 네트워크가</text>
<text x="32" y="126" font-size="13.5" fill="#5B6470">어떻게 동작하는지</text>
<text x="32" y="162" font-size="13.5" class="m" fill="#2B323B">Linux</text>
<text x="32" y="183" font-size="13.5" class="m" fill="#2B323B">TCP/IP</text>
<text x="32" y="204" font-size="13.5" class="m" fill="#2B323B">DNS</text>
<text x="32" y="225" font-size="13.5" class="m" fill="#2B323B">HTTP</text>
<rect x="179.2" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="179.2" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">2</tspan>  <tspan font-weight="600" fill="#0B0F17">구축</tspan></text>
<text x="179.2" y="106" font-size="13.5" fill="#5B6470">CSP 하나로 서비스 환경</text>
<text x="179.2" y="126" font-size="13.5" fill="#5B6470">만들기</text>
<text x="179.2" y="162" font-size="13.5" class="m" fill="#2B323B">AWS</text>
<rect x="326.4" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="326.4" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">3</tspan>  <tspan font-weight="600" fill="#0B0F17">운영</tspan></text>
<text x="326.4" y="106" font-size="13.5" fill="#5B6470">지표와 로그로 문제 범위</text>
<text x="326.4" y="126" font-size="13.5" fill="#5B6470">좁히기</text>
<text x="326.4" y="162" font-size="13.5" class="m" fill="#2B323B">CloudWatch</text>
<text x="326.4" y="183" font-size="13.5" class="m" fill="#2B323B">Prometheus</text>
<rect x="473.6" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="473.6" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">4</tspan>  <tspan font-weight="600" fill="#0B0F17">자동화</tspan></text>
<text x="473.6" y="106" font-size="13.5" fill="#5B6470">반복 작업을 재현</text>
<text x="473.6" y="126" font-size="13.5" fill="#5B6470">가능하게</text>
<text x="473.6" y="162" font-size="13.5" class="m" fill="#2B323B">Git</text>
<text x="473.6" y="183" font-size="13.5" fill="#2B323B">스크립트</text>
<text x="473.6" y="204" font-size="13.5" class="m" fill="#2B323B">Terraform</text>
<rect x="620.8" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="620.8" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">5</tspan>  <tspan font-weight="600" fill="#0B0F17">컨테이너</tspan></text>
<text x="620.8" y="106" font-size="13.5" fill="#5B6470">실행 환경과 배포 환경</text>
<text x="620.8" y="126" font-size="13.5" fill="#5B6470">이해하기</text>
<text x="620.8" y="162" font-size="13.5" class="m" fill="#2B323B">Docker</text>
<text x="620.8" y="183" font-size="13.5" class="m" fill="#2B323B">Kubernetes</text>
</svg>
