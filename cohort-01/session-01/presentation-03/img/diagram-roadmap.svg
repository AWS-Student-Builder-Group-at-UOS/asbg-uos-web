<text x="48" y="260" font-size="10.5" fill="#35526A">서버·네트워크 동작 이해</text>
<text x="48" y="284" font-size="11" fill="#1160D8">Linux · TCP/IP</text>
<text x="48" y="298" font-size="11" fill="#1160D8">DNS · HTTP</text>
<rect x="218" y="184" width="170" height="100" fill="#FFFFFF" stroke="#79CDFF"/>
