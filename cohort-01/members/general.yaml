- id: kang-eunjung
  name: { ko: 강은중, en: Eunjung Kang }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/kang-eunjung.jpg
  links:
    github: https://github.com/7lyomi
  keywords: [Networking, Economics, Cats]
  description:
    ko: "복학한 지 반년밖에 안 돼 경제학부 복수전공, 대외활동 등 여러 갈래로 고민하는 중입니다. 새로운 경험을 좋아해서, 여기서는 네트워킹 기초 지식을 왕창 챙겨 가려 합니다. 집에 고양이와 살고 있고, 편하게 말 걸어 주세요."
    en: "I only came back to school six months ago, and I'm weighing a few paths at once, including a second major in economics and some outside activities. I like new experiences, and here I'm hoping to soak up as much networking fundamentals as I can. I live with a cat, and please feel free to say hi."

- id: kim-gyutae
  name: { ko: 김규태, en: Gyutae Kim }
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/kim-gyutae.jpg
  links:
    github: https://github.com/kanggregorics03
  keywords: [Backend, AWS, Keyboards]
  description:
    ko: "백엔드 개발자를 목표로 공부하고 있고, AWS와 클라우드도 제대로 배워 보려 합니다. 아직 배우는 단계라, 다른 분들이 어떻게 공부하고 개발하는지도 보고 배우고 싶습니다. 최근 기계식 키보드에 입문해 하나씩 모으는 중입니다."
    en: "I'm working toward becoming a backend developer, and I want to properly learn AWS and the cloud along the way. I'm still early on, so I'd like to see how others study and build, and pick things up from them. I recently got into mechanical keyboards and have started collecting them one by one."

- id: min-hyunjun
  name: { ko: 민현준, en: Hyunjun Min }
