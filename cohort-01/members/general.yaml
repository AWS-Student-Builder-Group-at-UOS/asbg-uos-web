  description:
    ko: "서울시립대학교 컴퓨터과학부에서 공부하며 백엔드 개발과 데이터 분석을 중심으로 경험을 쌓고 있습니다. Spring Boot와 MySQL을 활용한 금융 서비스 프로젝트, Python 데이터 분석, AIM Challenge를 통한 AI·GPU 서버 프로젝트 등을 진행하며 다양한 분야를 직접 접해 봤습니다. 아직 배우는 과정이지만, 단순히 기술을 공부하는 데 그치지 않고 직접 만들어 보고 오류를 해결하는 과정에서 많이 성장하고 있습니다. 앞으로는 AWS 같은 클라우드 환경까지 경험을 넓혀, 안정적인 서비스를 개발하고 운영할 수 있는 개발자가 되는 것이 목표입니다."
    en: "I'm studying Computer Science at the University of Seoul and building experience in backend development and data analysis. I've explored a range of areas through projects, including a financial service built with Spring Boot and MySQL, data analysis with Python, and an AI and GPU server project through the AIM Challenge. I'm still learning, but I've grown a lot by going beyond studying technologies to actually building things and troubleshooting errors. My goal is to expand my experience to cloud environments such as AWS and become a developer who can build and operate reliable services."
