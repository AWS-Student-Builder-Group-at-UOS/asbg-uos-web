    en: While studying backend development, I've often felt gaps in my understanding of infrastructure, including servers, networks, and deployment. Lately, I've been focusing on understanding the fundamentals thoroughly rather than picking up a wide range of technologies. I want to go beyond seeing the full flow of how services are deployed and operated to deeply understand the infrastructure that supports them. At ASBG UOS, I hope to build a solid foundation in infrastructure through hands-on learning with peers who share these questions.
