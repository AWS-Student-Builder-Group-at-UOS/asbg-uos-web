  description:
    ko: "컴퓨터 비전으로 시작해 요즘은 LLM, AI Agent, RAG 개발 인턴을 하고 있습니다. 서버, 네트워크, 클라우드는 아직 부족해서 이번 기회에 제대로 공부하려 합니다. 다이어트 중이지만 맛집과 분위기 좋은 카페는 여전히 좋아합니다."
    en: "I got into AI through computer vision, and these days I'm interning on LLM, AI agent, and RAG development. Servers, networking, and cloud are still gaps for me, so I'm here to study them properly this time. I'm on a diet, but I still love a good restaurant and a cafe with the right atmosphere."

