    ko: "백엔드를 공부하고 있고, 특히 스트리밍과 동시성 문제가 궁금하지만 관심사는 넓은 편입니다. 실 운영 경험이 없어 AWS와 인프라, 통신을 폭넓게 배우고 싶습니다. 요즘은 최애 예능인 크라임씬을 다시 보는 중이고, 재밌는 콘텐츠 추천은 늘 환영입니다."
