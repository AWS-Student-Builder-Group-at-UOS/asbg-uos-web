    en: Computer Science
  links:
    github: https://github.com/jiyun5826
  keywords:
    - Backend
    - CI/CD
    - Server Operations
  description:
    ko: "백엔드 개발을 하며 직접 서비스를 배포해 보니, 기능을 구현하는 데서 그치지 않고 서버가 어떻게 동작하는지, 제가 만든 코드가 어떤 과정을 거쳐 실제 서비스로 배포되는지까지 제대로 이해하고 싶어졌습니다. 그 과정에서 AWS, Docker, Nginx 등을 직접 다루며 자연스럽게 인프라와 클라우드에도 관심을 갖게 되었고, 이 분야를 더 체계적으로 공부하고 싶습니다! 아직 모르는 것이 많지만, 궁금한 것은 직접 찾아보고 적용해 봐야 제대로 배울 수 있다고 생각합니다. ASBG UOS에서 다양한 경험을 쌓으며 백엔드 코드가 실제 서비스로 이어지는 전체 과정을 알아가고 싶습니다."
    en: "Deploying a service myself while working on backend development made me want to understand more than feature implementation. I wanted to know how servers work and how the code I write becomes a running service. Working hands-on with AWS, Docker, and Nginx along the way naturally sparked my interest in infrastructure and the cloud, and I'd like to study these areas more systematically! There's still a lot I don't know, but I believe I learn best by researching my questions and putting what I find into practice. Through a variety of experiences at ASBG UOS, I hope to understand the entire journey from backend code to a live service."
