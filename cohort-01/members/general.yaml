  links:
    github: https://github.com/7lyomi
  keywords:
    - Cloud
    - Data Analysis
    - IT Planning
  description:
    ko: "일상에서 불편한 점을 발견하면 “이걸 기술로 조금 더 편하게 만들 수 없을까?”라는 생각을 자주 합니다. 학원 알림톡 자동화 도구를 직접 만들어 실제 업무에 적용하고, 공공데이터를 분석해 문제를 정의하고 해결책을 제안하는 프로젝트에도 참여하며 아이디어를 실제 결과물로 만들어 가는 경험을 쌓고 있습니다. 이런 과정에서 단순히 코드를 잘 작성하는 것보다 어떤 문제를 해결할지 고민하고, 직접 만들어 본 뒤 다시 개선하는 과정에 더 큰 재미를 느꼈습니다. 아직 개발, 데이터, 서비스 기획 등 여러 분야를 경험하며 제 방향을 찾아가는 중이지만, 새로운 기술을 배우고 직접 적용해 보는 것을 좋아합니다. ASBG UOS에서도 서로 만든 것을 공유하고 편하게 질문하며 함께 성장할 수 있는 동료가 되고 싶습니다. 감사합니다!"
    en: "When I notice an inconvenience in everyday life, I often wonder, “Could technology make this a little easier?” I've been gaining experience turning ideas into working solutions, from building an automated KakaoTalk notification tool for a private academy and putting it to use in its day-to-day work, to joining projects that use public data to define problems and propose solutions. Through these experiences, I've found that I enjoy deciding which problems to solve, building something, and improving it even more than simply writing good code. I'm still finding my direction as I explore development, data, and service planning, but I love learning new technologies and putting them into practice. At ASBG UOS, I hope we can share what we've built, feel comfortable asking each other questions, and grow together as teammates. Thank you!"
