    en: I'm interested in backend development and have been studying it, but I still have a lot to learn about building and operating real services. My curiosity about how the programs I write run on actual servers and reach users is what drew me to AWS and the cloud. At ASBG UOS, I hope to explore different technologies and deepen my understanding of the cloud. I'd also like to be a supportive teammate who learns with others and works through challenges together.
