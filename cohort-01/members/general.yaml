  keywords: [Backend, Deployment, Penguins]
  description:
    ko: "백엔드 기본기를 다지는 중입니다. 서버와 네트워크, 특히 실제 배포까지 이어지는 과정을 제대로 배우고 싶습니다. 아직 부족한 게 많은 만큼 열심히 해볼 생각이고, 참고로 펭귄은 의외로 다리가 길고 무릎도 있다고 합니다."
    en: "I'm working on my backend fundamentals, and what I most want to learn here is servers and networking, especially the part where things actually get deployed. I know I have a lot to catch up on, so I plan to put in the work. Unrelated: penguins apparently have surprisingly long legs, knees included."

