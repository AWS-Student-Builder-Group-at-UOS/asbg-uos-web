  description:
    ko: "데이터 분석과 AI에 관심이 많고, 요즘은 AWS 같은 클라우드로도 관심을 넓히고 있습니다. 처음엔 낯을 가리지만 친해지면 편하게 이야기합니다. 대전까지 빵을 먹으러 갈 만큼 먹는 낙으로 살고 있어서, 맛집이나 카페를 추천해 주시면 꼭 가 봅니다."
