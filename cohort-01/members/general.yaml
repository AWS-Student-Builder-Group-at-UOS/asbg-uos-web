  description:
    ko: 백엔드 개발을 공부하면서 개별 기능을 구현하는 것보다 그 기능이 실제 서비스 안에서 어떻게 연결되고 운영되는지가 더 궁금해졌습니다. API를 만들고 데이터베이스를 다루는 과정도 재미있지만, 배포 이후 서버가 어떻게 동작하는지, 트래픽이 늘어나면 어떤 문제가 생기는지에도 관심이 많습니다. 최근에는 AWS와 클라우드 환경을 공부하면서 개발과 운영이 생각보다 훨씬 밀접하다는 점을 알아가고 있습니다. 기술에 대한 시야를 넓히고, 제가 만든 서비스를 더 잘 이해하는 개발자로 성장하고 싶습니다.
    en: As I study backend development, I've become more curious about how features connect and operate within a real service than about implementing any single feature. I enjoy building APIs and working with databases, but I'm also interested in how servers behave after deployment and what kinds of problems arise as traffic grows. Recently, while learning about AWS and cloud environments, I've been discovering how much more closely development and operations are connected than I expected. I want to broaden my technical perspective and become a developer who understands the services I build more deeply.
