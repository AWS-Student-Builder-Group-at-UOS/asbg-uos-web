  description:
    ko: "AI 기반 외신 빅데이터 분석 플랫폼의 데이터를 활용해 주간 언론 동향 보고서를 작성하며, 반복되는 전처리 과정을 코드로 표준화해 작업 시간을 줄였습니다. n8n으로 AI 상담 챗봇과 요약 메일 전송을 자동화하는 워크플로도 구축했습니다. 자동화를 만들다 보니 이런 서비스가 어떤 구조 위에서 동작하는지 궁금해졌습니다. ASBG UOS에서는 데이터베이스와 클라우드 인프라를 더 깊이 공부하고 싶습니다. 자격증 트랙에도 함께 도전할 계획입니다. 관심사를 나누는 동료가 되고 싶습니다!"
    en: "While preparing weekly media trend reports using data from an AI-powered big data platform for international news analysis, I reduced the time spent on repetitive preprocessing by standardizing it in code. I also built n8n workflows to automate an AI consultation chatbot and the delivery of summary emails. Building these automations made me curious about the architecture that supports services like these. At ASBG UOS, I'd like to study databases and cloud infrastructure in greater depth. I also plan to take on the certification track with fellow members. I look forward to sharing our interests and learning together!"
- id: jeong-jiyun
  name:
