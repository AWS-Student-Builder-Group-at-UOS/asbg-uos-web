  keywords: [Database, Cloud, Chiikawa]
  description:
    ko: "요즘 가장 관심 있는 건 DB와 클라우드인데, 생각보다 할 게 많아서 더 재밌습니다. 인프라 지식을 보완하고, 무엇보다 직접 환경을 구축해 보며 실전 감각을 익히고 싶습니다. 치이카와를 보고 있는데, 꽤 듬직하고 멋있는 랏코를 홍보합니다."
    en: "Right now I'm most into databases and cloud. There's more to them than I expected, which makes them more fun. I want to fill in my infrastructure gaps and, above all, build and run real environments with my own hands. I've been watching Chiikawa, and I'd like to put in a word for Rakko, who is quite dependable and cool."

