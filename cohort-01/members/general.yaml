  photo: img/min-hyunjun.jpg
  links:
    github: https://github.com/UOSAIMHJ
  keywords: ["Machine Learning", "Deep Learning", "Team Project"]
  description:
    ko: "머신러닝과 딥러닝을 공부하고 있고, 이를 적극적으로 활용하는 팀 프로젝트 경험을 쌓고 싶습니다. 서로 부족한 부분을 채우며 끝까지 결과를 내는 팀을 좋아합니다. 처음엔 조용해 보여도 친해지면 말이 많아지는 편이라 먼저 다가가려 합니다."
    en: "I'm studying machine learning and deep learning, and I'd like to gain team project experience where they actually get put to use. I like teams that cover for each other's gaps and see things through to a result. I may seem quiet at first, but I open up once we get to know each other, and I'll try to make the first move."

- id: park-jonghyuk
