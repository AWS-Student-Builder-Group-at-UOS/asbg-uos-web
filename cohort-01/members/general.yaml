  keywords: [Backend, Infra, Novels]
  description:
    ko: "백엔드를 공부하다 서버 운영이 궁금해져 AWS와 인프라를 들여다보고 있고, 직접 다뤄 보며 어떻게 구성되고 운영되는지 경험하고 싶습니다. 건실하게 살아보려 독서를 시작했는데, 물론 소설만 읽습니다. 좋은 책 추천은 환영입니다."
    en: "Studying backend got me curious about running servers, so I've been looking into AWS and infrastructure, and I want to get hands-on and see how it's actually put together and operated. I took up reading to live a more wholesome life, novels only, of course. Book recommendations are welcome."

