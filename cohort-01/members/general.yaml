    ko: "프론트엔드를 주로 하다가 최근 백엔드를 시작했고, AWS 수업을 계기로 클라우드와 인프라도 차근차근 익히는 중입니다. 인프라 기초를 다지고 팀원들과도 친해지고 싶습니다. 보드게임을 좋아하고 할리갈리 42연승 기록이 있으니 1대1 승부는 환영입니다."
