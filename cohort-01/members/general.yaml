  description:
    ko: 여러 프로젝트와 공모전에 참여하면서 아이디어를 실제 서비스로 구현해 보고 싶어 최근 프론트엔드 개발 공부를 시작했습니다. 아직 배우는 단계이지만, 화면을 만드는 것뿐 아니라 데이터베이스와 서버가 어떻게 연결되고 AWS를 통해 서비스가 어떻게 배포되는지에도 관심이 있습니다. ASBG UOS에서 프로젝트를 직접 진행하며 프론트엔드 실력을 쌓고, 서비스 전체 구조에 대한 이해도 함께 넓혀 가고 싶습니다.
    en: "After taking part in various projects and competitions, I wanted to turn my ideas into real services, so I recently started learning frontend development. I'm still learning, but my interests go beyond building interfaces: I'm also curious about how databases connect to servers and how services are deployed on AWS. Through hands-on projects at ASBG UOS, I hope to build my frontend skills while gaining a broader understanding of how a service works as a whole."
- id: baik-hyungwoo
  name:
    ko: 백형우
    en: Hyungwoo Baik
  major:
    ko: 컴퓨터과학부
    en: Computer Science
  photo: img/baik-hyungwoo.jpg
  links:
    github: https://github.com/ryanbaik0703
    linkedin: https://www.linkedin.com/in/hyungwoo-baik-777174335/
  keywords:
    - Data Analysis
    - PM
    - Cloud Infrastructure
  description:
    ko: "데이터 분석과 AI에 관심을 가지고 공부하면서, 요즘은 기능을 만드는 것뿐 아니라 서비스가 보이지 않는 곳에서 어떻게 구현되고 운영되는지도 궁금해지고 있습니다. ASBG UOS 1기 활동을 통해 AWS를 기반으로 서버, 네트워크, 스토리지 등 클라우드 인프라가 어떻게 구성되고 연결되는지 배우고 싶습니다. 특히 서비스의 목적에 맞게 아키텍처를 설계하고 안정성과 확장성을 고려하는 방법에 관심이 있습니다. 데이터와 AI에 대한 관심을 클라우드까지 넓히며, 실제 서비스가 만들어지는 전체 과정을 이해하고 싶습니다!"
    en: "As I study data analysis and AI, I've become curious about more than building features. I also want to understand how the services behind them are implemented and operated. As part of ASBG UOS's first cohort, I'd like to learn how cloud infrastructure—including servers, networks, and storage—is set up and connected on AWS. I'm especially interested in designing architectures around a service's purpose while accounting for reliability and scalability. By extending my interests in data and AI to the cloud, I hope to understand the full process of bringing a real service to life!"
- id: kang-eunjung
  name:
    ko: 강은중
