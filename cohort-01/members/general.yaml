    ko: 주로 프론트엔드 개발을 해 오다가 최근 백엔드 공부를 시작했습니다. AWS 교육을 계기로 클라우드와 인프라 분야에 관심을 갖게 되었고, 개발 역량을 키우는 데도 관련 지식이 많이 필요하다고 느껴 차근차근 공부하고 있습니다. ASBG UOS에서는 AWS와 인프라에 대한 기초 지식을 탄탄히 쌓고, 팀원들과 적극적으로 교류하며 함께 성장하고 싶습니다. 💭
    en: I've mainly worked on frontend development and recently started learning backend development. Taking an AWS course sparked my interest in cloud and infrastructure, and I've been studying them step by step because I feel this knowledge is also essential to becoming a better developer. At ASBG UOS, I'd like to build a solid foundation in AWS and infrastructure, actively connect with my teammates, and grow together. 💭
