- id: son-subin
  name: { ko: 손수빈, en: Subin Son }
  role: Leader
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/son-subin.jpg
  links:
    github: https://github.com/ssub17
  keywords: [Kubernetes, Networking, "Animal Crossing"]
  description:
    ko: "교내에 클라우드 진로 관련 활동이 없어 직접 동아리를 만들었습니다. 요즘은 쿠버네티스에 관심이 많고, 타대학과 현직자분들과의 네트워킹을 기대합니다. 최근 저의 붐은 동물의 숲 캐릭터 삐로코인데, 귀여운지 객관적인 판단을 부탁드립니다."
    en: "There was nothing on campus for people interested in cloud careers, so I started this club myself. Lately I'm into Kubernetes, and I'm looking forward to meeting people from other universities and from the industry. My current obsession is an Animal Crossing villager named Ppiroko, and I'd like an objective verdict on the cuteness."

- id: hwang-sujin
  name: { ko: 황수진, en: Sujin Hwang }
  role: Tech Lead
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/hwang-sujin.jpg
  links:
    github: https://github.com/abroniasj416
  keywords: [Linux, Container, Lizards]
  description:
    ko: "전공에서 만난 것 중 클라우드가 가장 재미있어 클라우드와 인프라를 파고 있습니다. 요즘은 리눅스, 네트워크, 컨테이너를 보고 있고, 클라우드 대장 AWS를 제대로 배우고 싶습니다. 헬스와 러닝을 매일 하고, 도마뱀 박사로서 도마뱀 상담도 받습니다."
    en: "Of everything I've met in my CS major, cloud has been the most fun, so I've been digging into cloud and infrastructure. Right now that means Linux, networking, and containers, and I want to properly learn AWS, the big boss of cloud. I lift and run every day, and as a self-proclaimed lizard expert I take lizard questions too."

- id: lee-yena
  name: { ko: 이예나, en: Yena Lee }
  role: Tech Lead
  major: { ko: 전자전기컴퓨터공학부, en: Electrical and Computer Engineering }
  photo: img/lee-yena.jpg
  links:
    github: https://github.com/i2na
    website: http://yena.io.kr/
  keywords: [Serverless, Container, Cats]
  description:
    ko: "서버리스, 컨테이너, DB, 네트워크를 상황에 맞게 어떻게 조합하는지 뜯어보는 걸 좋아합니다. 새싹 개발자지만, AI가 동료로 자리 잡은 지금은 한 사람이 여러 분야를 파볼 수 있는 때라 믿고 인프라를 공부해 공유하려 합니다. 고양이 이야기도 좋아합니다."
    en: "I like pulling apart how serverless, containers, databases, and networking fit together for a given situation. I'm still a sprout of a developer, but with AI now a real colleague at work, I think this is a time when one person can go deep in several fields, so I'm studying infrastructure to share what I learn. Cat talk is always welcome."

- id: lee-chaewoo
  name: { ko: 이채우, en: Chaewoo Lee }
  role: Director of Events
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/lee-chaewoo.jpg
  links:
    github: https://github.com/2fill
  keywords: [Frontend, "Medical AI", Dance]
  description:
    ko: "PM, 창업, AI도 좋지만 첫 취업은 학교 내내 해온 프론트엔드로 정했습니다. 의료 AI 연구실에서 논문도 썼고, 새로운 걸 배우는 게 좋아 인프라 아는 개발자가 되려고 왔습니다. 운동 이야기는 다 좋고, 춤 같이 출 사람은 없겠죠."
    en: "I'm curious about PM, startups, and AI too, but since I've done frontend all through school, my first job will be frontend. I published a paper at a medical AI lab, and I joined because I like learning new things and want to be a developer who understands infrastructure. I'm up for any conversation about sports; I'm guessing nobody wants to dance with me, though."

- id: jang-jiwon
  name: { ko: 장지원, en: Jiwon Jang }
  role: Director of Marketing
  major: { ko: 컴퓨터과학부, en: Computer Science }
  photo: img/jang-jiwon.jpg
  links:
    github: https://github.com/uukdo
  keywords: [DevOps, Startup, Doraemon]
  description:
    ko: "창업에 마음이 가면서 프론트엔드와 백엔드를 넘어 클라우드와 DevOps까지 직접 다뤄 보려 합니다. 실제 서비스를 운영하는 감각을 키우고, SAA 공부도 병행할 생각입니다. 도라에몽 주머니처럼 뭐든 말씀만 하시면 바로 달려갑니다."
    en: "Lately I've been drawn to starting something of my own, so I want to go beyond frontend and backend and get hands-on with cloud and DevOps. I'm building a feel for running a real service, and studying for the SAA alongside. Think of me as Doraemon's pocket: say the word and I'll come running."
