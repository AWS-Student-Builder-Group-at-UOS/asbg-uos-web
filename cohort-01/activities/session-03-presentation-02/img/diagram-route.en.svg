<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-label="The sign-up function saves PENDING in DynamoDB, publishes an event, and responds with 202. The EventBridge event rule sends matching events to the SQS issuing queue, which holds the work and hands it to the issuing function, and the issuing function makes the badge and records ISSUED in the same table. Messages that fail three times are isolated in the DLQ">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="372" fill="#FFFFFF"/>
<rect x="32" y="32" width="158" height="104" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="111" y="71.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Sign-up function</text>
<text x="111" y="89.92" font-size="13" fill="#5B6470" text-anchor="middle">RegisterFunction</text>
<text x="111" y="108.14" font-size="13" fill="#5B6470" text-anchor="middle">Emits event, sends 202</text>
<rect x="224" y="32" width="158" height="104" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="303" y="71.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Event rule</text>
<text x="303" y="89.92" font-size="13" fill="#5B6470" text-anchor="middle">EventBridge</text>
<text x="303" y="108.14" font-size="13" fill="#5B6470" text-anchor="middle">Forwards on a match</text>
<rect x="416" y="32" width="158" height="104" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<text x="495" y="71.7" font-size="16" font-weight="600" fill="#1160D8" text-anchor="middle">Issuing queue</text>
<text x="495" y="89.92" font-size="13" fill="#1160D8" text-anchor="middle">SQS</text>
<text x="495" y="108.14" font-size="13" fill="#1160D8" text-anchor="middle">Buffers bursts of work</text>
<rect x="608" y="32" width="158" height="104" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="687" y="71.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Issuing function</text>
<text x="687" y="89.92" font-size="13" fill="#5B6470" text-anchor="middle">IssueFunction</text>
<text x="687" y="108.14" font-size="13" fill="#5B6470" text-anchor="middle">Makes the badge</text>
