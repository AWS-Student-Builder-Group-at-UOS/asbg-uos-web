<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 318" role="img" aria-label="Six steps to recover a failed sign-up. The first three, which everyone does themselves, are looking up the failed ID again to see PENDING, finding the rising receiveCount and issue_failed in the logs, and finding the failed ID&#x27;s message in the DLQ. The last three, shown in a demo and continued as the assignment, are fixing and deploying the code, a redrive that sends the DLQ message back to the issuing queue, and verifying that the original ID is now ISSUED with issueCount 1">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-mono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="318" fill="#FFFFFF"/>
<text x="32" y="42" font-size="13" fill="#8A94A0">On your own</text>
<rect x="32" y="56" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="48" y="74" width="20" height="20" fill="#0B0F17"/>
<text x="58" y="88.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="78" y="89" font-size="15.5" font-weight="600" fill="#0B0F17">Look it up again</text>
<text x="48" y="124" font-size="13.5" fill="#5B6470"><tspan class="m">PENDING</tspan> unchanged</text>
<rect x="288" y="56" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="304" y="74" width="20" height="20" fill="#0B0F17"/>
<text x="314" y="88.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="334" y="89" font-size="15.5" font-weight="600" fill="#0B0F17">Check the logs</text>
<text x="304" y="124" font-size="13.5" fill="#5B6470"><tspan class="m">receiveCount</tspan> 1, 2, 3</text>
<rect x="544" y="56" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="560" y="74" width="20" height="20" fill="#0B0F17"/>
<text x="570" y="88.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="590" y="89" font-size="15.5" font-weight="600" fill="#0B0F17">Check the DLQ</text>
<text x="560" y="124" font-size="13.5" fill="#5B6470">The failed ID's message</text>
<path d="M256 100L281.5 100" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M288 100L280.5 103.75L280.5 96.25Z" fill="#5B6470"/>
<path d="M512 100L537.5 100" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M544 100L536.5 103.75L536.5 96.25Z" fill="#5B6470"/>
<text x="32" y="190" font-size="13" fill="#8A94A0">After the demo</text>
<rect x="32" y="204" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="48" y="222" width="20" height="20" fill="#0B0F17"/>
<text x="58" y="236.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="78" y="237" font-size="15.5" font-weight="600" fill="#0B0F17">Fix the code</text>
<text x="48" y="272" font-size="13.5" fill="#5B6470">Issues even with no affiliation</text>
<rect x="288" y="204" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="304" y="222" width="20" height="20" fill="#0B0F17"/>
<text x="314" y="236.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="334" y="237" font-size="15.5" font-weight="600" fill="#0B0F17">Redrive</text>
<text x="304" y="272" font-size="13.5" fill="#5B6470">DLQ to the issuing queue</text>
<rect x="544" y="204" width="224" height="88" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<rect x="560" y="222" width="20" height="20" fill="#1160D8"/>
<text x="570" y="236.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="590" y="237" font-size="15.5" font-weight="600" fill="#1160D8">Verify the original ID</text>
<text x="560" y="272" font-size="13.5" fill="#1160D8"><tspan class="m">ISSUED</tspan>, <tspan class="m">issueCount 1</tspan></text>
<path d="M256 248L281.5 248" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M288 248L280.5 251.75L280.5 244.25Z" fill="#5B6470"/>
<path d="M512 248L537.5 248" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M544 248L536.5 251.75L536.5 244.25Z" fill="#5B6470"/>
<path d="M656 144L656 166L144 166L144 197.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M144 204L140.25 196.5L147.75 196.5Z" fill="#5B6470"/>
</svg>
