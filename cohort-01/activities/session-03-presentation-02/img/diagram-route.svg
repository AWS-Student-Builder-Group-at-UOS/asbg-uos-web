<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" role="img" aria-label="신청 함수가 DynamoDB에 PENDING을 저장하고 이벤트를 발행한 뒤 202로 응답한다. EventBridge 이벤트 규칙이 조건에 맞는 이벤트를 SQS 발급 큐로 보내고, 큐가 일을 보관했다가 발급 함수에 넘기면 발급 함수가 참가증을 만들어 같은 테이블에 ISSUED를 기록한다. 세 번 실패한 메시지는 DLQ로 격리된다">
