<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="Each time the issuing function receives the message, receiveCount goes up to 1, 2, and 3, and when a run ends in an error, the message is hidden in the queue for the 60-second visibility timeout and then reappears. If the third receive also fails, it is isolated in the DLQ because the maximum receive count is 3">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="200" fill="#FFFFFF"/>
<rect x="32" y="40" width="140" height="96" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="102" y="75.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Receive 1</text>
<text x="102" y="93.92" font-size="13" fill="#5B6470" text-anchor="middle">receiveCount 1</text>
<text x="102" y="112.14" font-size="13" fill="#5B6470" text-anchor="middle">Run ends in error</text>
<rect x="222" y="40" width="140" height="96" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="292" y="75.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Receive 2</text>
<text x="292" y="93.92" font-size="13" fill="#5B6470" text-anchor="middle">receiveCount 2</text>
<text x="292" y="112.14" font-size="13" fill="#5B6470" text-anchor="middle">Run ends in error</text>
<rect x="412" y="40" width="140" height="96" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="482" y="75.7" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Receive 3</text>
<text x="482" y="93.92" font-size="13" fill="#5B6470" text-anchor="middle">receiveCount 3</text>
<text x="482" y="112.14" font-size="13" fill="#5B6470" text-anchor="middle">Run ends in error</text>
<rect x="602" y="40" width="166" height="96" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="685" y="75.7" font-size="16" font-weight="600" fill="#1160D8" text-anchor="middle">DLQ</text>
<text x="685" y="93.92" font-size="13" fill="#1160D8" text-anchor="middle">Max receives: 3</text>
<text x="685" y="112.14" font-size="13" fill="#1160D8" text-anchor="middle">Isolated and kept</text>
<path d="M172 88L215.5 88" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M222 88L214.5 91.75L214.5 84.25Z" fill="#5B6470"/>
<text x="197" y="78" font-size="13" class="m" fill="#5B6470" text-anchor="middle">60s</text>
<path d="M362 88L405.5 88" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M412 88L404.5 91.75L404.5 84.25Z" fill="#5B6470"/>
<text x="387" y="78" font-size="13" class="m" fill="#5B6470" text-anchor="middle">60s</text>
<path d="M552 88L595.5 88" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M602 88L594.5 91.75L594.5 84.25Z" fill="#5B6470"/>
<text x="577" y="78" font-size="13" class="m" fill="#5B6470" text-anchor="middle">3rd</text>
<text x="32" y="172" font-size="13" fill="#5B6470"><tspan class="m" fill="#0B0F17">60s</tspan>  hidden in the queue for the visibility timeout, then visible again</text>
</svg>
