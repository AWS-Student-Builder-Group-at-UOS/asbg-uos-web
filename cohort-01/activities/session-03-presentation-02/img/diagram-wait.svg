<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" role="img" aria-label="실습 1 동기 방식은 저장과 접수, 지연 6초를 설정한 발급이 모두 끝난 뒤 201로 응답해 사용자가 접수와 발급을 모두 기다린다. 실습 2 비동기 방식은 저장과 접수 직후 202로 응답하고, 같은 길이의 발급은 응답 뒤에 처리되어 ISSUED가 된다">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
