<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" role="img" aria-label="In Lab 1, the synchronous approach, the response is 201 only after saving and accepting and issuing, with a 6-second delay set, are all done, so the user waits for both acceptance and issuing. In Lab 2, the asynchronous approach, the response is 202 right after saving and accepting, and issuing, which takes just as long, happens after the response and ends in ISSUED">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="292" fill="#FFFFFF"/>
<text x="32" y="94" font-size="15" font-weight="600" fill="#0B0F17">Lab 1</text>
<text x="32" y="116" font-size="13.5" fill="#5B6470">Synchronous</text>
<rect x="196" y="78" width="112" height="40" fill="#F4F6F8" stroke="#C5CCD4" stroke-width="1"/>
<text x="252" y="103" font-size="13.5" fill="#2B323B" text-anchor="middle">Save, accept</text>
<rect x="308" y="78" width="440" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="528" y="103" font-size="13.5" fill="#2B323B" text-anchor="middle">Issuing, 6s delay set</text>
<path d="M748 72L748 128" fill="none" stroke="#0B0F17" stroke-width="1.5"/>
<text x="748" y="146" font-size="13" class="m" fill="#0B0F17" text-anchor="middle">201</text>
<path d="M196 68V62H748V68" fill="none" stroke="#5B6470" stroke-width="1.5"/>
<text x="196" y="52" font-size="13.5" fill="#5B6470">User waits: acceptance and issuing</text>
<text x="32" y="220" font-size="15" font-weight="600" fill="#0B0F17">Lab 2</text>
<text x="32" y="242" font-size="13.5" fill="#5B6470">Asynchronous</text>
<rect x="196" y="204" width="112" height="40" fill="#F4F6F8" stroke="#C5CCD4" stroke-width="1"/>
<text x="252" y="229" font-size="13.5" fill="#2B323B" text-anchor="middle">Save, accept</text>
<rect x="308" y="204" width="440" height="40" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1" stroke-dasharray="5 4"/>
<text x="528" y="229" font-size="13.5" fill="#5B6470" text-anchor="middle">Issued after the response, <tspan class="m">ISSUED</tspan></text>
<path d="M308 198L308 254" fill="none" stroke="#0B0F17" stroke-width="1.5"/>
<text x="308" y="272" font-size="13" class="m" fill="#0B0F17" text-anchor="middle">202</text>
<path d="M196 194V188H308V194" fill="none" stroke="#1160D8" stroke-width="1.5"/>
<text x="196" y="178" font-size="13.5" font-weight="600" fill="#1160D8">User waits: until accepted</text>
</svg>
