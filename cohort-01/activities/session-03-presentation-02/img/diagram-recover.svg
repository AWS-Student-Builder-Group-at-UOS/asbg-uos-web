<path d="M512 100L537.5 100" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M544 100L536.5 103.75L536.5 96.25Z" fill="#5B6470"/>
<text x="32" y="190" font-size="13" fill="#8A94A0">시연 후 과제로</text>
<rect x="32" y="204" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="48" y="222" width="20" height="20" fill="#0B0F17"/>
<text x="58" y="236.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="78" y="237" font-size="15.5" font-weight="600" fill="#0B0F17">코드 수정</text>
<text x="48" y="272" font-size="13.5" fill="#5B6470">소속이 비어도 발급</text>
<rect x="288" y="204" width="224" height="88" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="304" y="222" width="20" height="20" fill="#0B0F17"/>
