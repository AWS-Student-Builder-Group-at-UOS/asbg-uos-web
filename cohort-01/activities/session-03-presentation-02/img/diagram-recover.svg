<path d="M656 144L656 166L144 166L144 197.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M144 204L140.25 196.5L147.75 196.5Z" fill="#5B6470"/>
</svg>
