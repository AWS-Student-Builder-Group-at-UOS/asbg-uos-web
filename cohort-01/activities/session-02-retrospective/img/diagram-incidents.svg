<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" role="img" aria-label="지난 학기 수강신청 포털에서 일어난 세 가지 문제. 요청이 다른 APP으로 가거나 서버가 재시작, 교체되면 로그인이 풀렸고, 응답하지 않는 APP에도 요청이 계속 갔고, 몰린 요청에 서버를 손으로 늘리느라 늦은 데다 끝난 뒤에도 남은 서버로 비용이 나갔다">
<style>
@font-face{font-family:"d-mono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="328" fill="#FFFFFF"/>
<rect x="112" y="56" width="240" height="52" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="232" y="87.92" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">학생들의 요청</text>
<path d="M232 108L232 158L90 158L90 201.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M90 208L86.25 200.5L93.75 200.5Z" fill="#5B6470"/>
<path d="M232 108L232 201.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M232 208L228.25 200.5L235.75 200.5Z" fill="#5B6470"/>
<path d="M232 158L374 158L374 201.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="miter"/>
<path d="M374 208L370.25 200.5L377.75 200.5Z" fill="#5B6470"/>
<rect x="32" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="90" y="245.92" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">APP 1</text>
<rect x="174" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="232" y="236.58" font-size="16" font-weight="600" fill="#8A94A0" text-anchor="middle">APP 2</text>
<text x="232" y="255.27" font-size="13.5" fill="#8A94A0" text-anchor="middle">응답 없음</text>
<path d="M271 217L281 227M281 217L271 227" fill="none" stroke="#8A94A0" stroke-width="2"/>
<rect x="316" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="374" y="236.58" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">추가한 APP</text>
<text x="374" y="255.27" font-size="13.5" fill="#5B6470" text-anchor="middle">끝나도 남음</text>
<rect x="140" y="122" width="20" height="20" fill="#0B0F17"/>
<text x="150" y="136.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="242" y="172" width="20" height="20" fill="#0B0F17"/>
<text x="252" y="186.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="344" y="172" width="20" height="20" fill="#0B0F17"/>
<text x="354" y="186.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="464" y="36" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="50.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="494" y="51.5" font-size="16" font-weight="600" fill="#0B0F17">로그인이 풀린다</text>
<text x="494" y="78" font-size="14" fill="#5B6470">요청이 다른 APP으로 가거나 서버를 재시작,</text>
<text x="494" y="99" font-size="14" fill="#5B6470">교체하면 로그인이 풀렸다</text>
<rect x="464" y="133" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="147.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="494" y="148.5" font-size="16" font-weight="600" fill="#0B0F17">장애 대응이 늦다</text>
<text x="494" y="175" font-size="14" fill="#5B6470">응답하지 않는 APP에도 요청이 계속 갔고, 교체는</text>
<text x="494" y="196" font-size="14" fill="#5B6470">운영자가 직접 했다</text>
<rect x="464" y="230" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="244.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="494" y="245.5" font-size="16" font-weight="600" fill="#0B0F17">접속량을 따라가지 못한다</text>
<text x="494" y="272" font-size="14" fill="#5B6470">몰린 뒤에야 손으로 늘리느라 늦었고, 끝난 뒤에도</text>
<text x="494" y="293" font-size="14" fill="#5B6470">남은 서버로 비용이 나갔다</text>
</svg>
