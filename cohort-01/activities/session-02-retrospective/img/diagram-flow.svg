<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 212" role="img" aria-label="세션 02의 흐름. 네트워크 기초, 3-Tier 발표, EC2 한 대에 웹페이지를 띄운 실습까지는 세션에서 함께 했고, 수강신청 포털을 3-Tier로 설계하는 과제는 세션 뒤 각자 이어 간다">
<style>
