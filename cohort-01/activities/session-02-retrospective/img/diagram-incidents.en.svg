<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 328" role="img" aria-label="Three problems from last semester&#x27;s course registration portal. Logins dropped when requests reached the other APP or when servers restarted or were replaced, requests kept going to an APP that had stopped responding, and servers were added by hand after the rush began and left running after it ended">
<style>
@font-face{font-family:"d-mono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="328" fill="#FFFFFF"/>
<rect x="112" y="56" width="240" height="52" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
