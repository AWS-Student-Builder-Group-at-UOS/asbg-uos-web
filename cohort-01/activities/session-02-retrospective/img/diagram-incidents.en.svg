<path d="M374 208L370.25 200.5L377.75 200.5Z" fill="#5B6470"/>
<rect x="32" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="90" y="245.92" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">APP 1</text>
<rect x="174" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="232" y="236.58" font-size="16" font-weight="600" fill="#8A94A0" text-anchor="middle">APP 2</text>
<text x="232" y="255.27" font-size="13.5" fill="#8A94A0" text-anchor="middle">Not responding</text>
<path d="M271 217L281 227M281 217L271 227" fill="none" stroke="#8A94A0" stroke-width="2"/>
<rect x="316" y="208" width="116" height="64" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="374" y="236.58" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Added APP</text>
<text x="374" y="255.27" font-size="13.5" fill="#5B6470" text-anchor="middle">Left running</text>
<rect x="140" y="122" width="20" height="20" fill="#0B0F17"/>
<text x="150" y="136.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="242" y="172" width="20" height="20" fill="#0B0F17"/>
<text x="252" y="186.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="344" y="172" width="20" height="20" fill="#0B0F17"/>
<text x="354" y="186.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="464" y="36" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="50.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="494" y="51.5" font-size="16" font-weight="600" fill="#0B0F17">Logins drop</text>
<text x="494" y="78" font-size="14" fill="#5B6470">Logged out on the other APP, and after</text>
<text x="494" y="99" font-size="14" fill="#5B6470">restarts or replacements</text>
<rect x="464" y="133" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="147.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="494" y="148.5" font-size="16" font-weight="600" fill="#0B0F17">Failures linger</text>
<text x="494" y="175" font-size="14" fill="#5B6470">Requests kept reaching an unresponsive</text>
<text x="494" y="196" font-size="14" fill="#5B6470">APP, and replacing it was manual</text>
<rect x="464" y="230" width="20" height="20" fill="#0B0F17"/>
<text x="474" y="244.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="494" y="245.5" font-size="16" font-weight="600" fill="#0B0F17">Capacity lags</text>
<text x="494" y="272" font-size="14" fill="#5B6470">Added by hand after the rush began, still</text>
<text x="494" y="293" font-size="14" fill="#5B6470">billing after it ended</text>
