<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-label="시작은 AI로, 끝은 내가: 사람이 스펙과 테스트를 쓰고, AI가 구현하고, 자동 테스트가 피드백을 돌리고, 사람이 검증하고 책임진다">
<style>
