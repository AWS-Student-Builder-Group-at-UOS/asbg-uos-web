<path d="M466 178L418.5 178" fill="none" stroke="#1160D8" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M412 178L419.5 174.25L419.5 181.75Z" fill="#1160D8"/>
<text x="439" y="222" font-size="13" fill="#1160D8" text-anchor="middle">repeats while I sleep</text>
<path d="M626 170L659 170L659 104.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M659 98L662.75 105.5L655.25 105.5Z" fill="#5B6470"/>
