<text x="50" y="81.55" font-size="15" font-weight="700" fill="#0B0F17">Human</text>
<text x="50" y="175.55" font-size="15" font-weight="700" fill="#0B0F17">AI</text>
<rect x="126" y="54" width="186" height="44" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="219" y="81.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Write spec and tests</text>
