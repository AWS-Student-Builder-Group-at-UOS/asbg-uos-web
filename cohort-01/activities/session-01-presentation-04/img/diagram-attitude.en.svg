<text x="659" y="81.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Verify and own it</text>
<rect x="300" y="148" width="112" height="44" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="356" y="175.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Implement</text>
<rect x="466" y="142" width="160" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="546" y="166.44" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Automated tests</text>
<text x="546" y="184.66" font-size="13" fill="#5B6470" text-anchor="middle">feed back failures</text>
<path d="M219 98L219 170L293.5 170" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
