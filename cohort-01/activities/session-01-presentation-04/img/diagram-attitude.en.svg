<text x="62" y="285" font-size="15" fill="#0B0F17"><tspan font-weight="700">Leave open</tspan>  <tspan font-size="13.5" fill="#5B6470">where AI may iterate</tspan></text>
<text x="32" y="316" font-size="14" fill="#2B323B">iteration, drafts, tests, docs</text>
<rect x="416" y="277" width="18" height="11" fill="#0B0F17"/>
<path d="M420.5 277V270.2H429.5V277" fill="none" stroke="#0B0F17" stroke-width="2.4"/>
<text x="446" y="285" font-size="15" fill="#0B0F17"><tspan font-weight="700">Lock</tspan>  <tspan font-size="13.5" fill="#5B6470">where a person approves</tspan></text>
<text x="416" y="316" font-size="14" fill="#2B323B">user data, payments, deployment, security, big</text>
<text x="416" y="337" font-size="14" fill="#2B323B">structural changes</text>
