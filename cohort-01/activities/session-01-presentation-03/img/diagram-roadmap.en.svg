<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 275" role="img" aria-label="The five stages a cloud engineer needs: fundamentals, build, operate, automate, containers">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-mono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="275" fill="#FFFFFF"/>
<path d="M32 40L768 40" fill="none" stroke="#C5CCD4" stroke-width="1.25"/>
<rect x="32" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="32" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">1</tspan>  <tspan font-weight="600" fill="#0B0F17">Fundamentals</tspan></text>
<text x="32" y="106" font-size="13.5" fill="#5B6470">How servers and</text>
<text x="32" y="126" font-size="13.5" fill="#5B6470">networks work</text>
<text x="32" y="182" font-size="13.5" class="m" fill="#2B323B">Linux</text>
<text x="32" y="203" font-size="13.5" class="m" fill="#2B323B">TCP/IP</text>
<text x="32" y="224" font-size="13.5" class="m" fill="#2B323B">DNS</text>
<text x="32" y="245" font-size="13.5" class="m" fill="#2B323B">HTTP</text>
<rect x="179.2" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="179.2" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">2</tspan>  <tspan font-weight="600" fill="#0B0F17">Build</tspan></text>
<text x="179.2" y="106" font-size="13.5" fill="#5B6470">Build a service on</text>
<text x="179.2" y="126" font-size="13.5" fill="#5B6470">one CSP</text>
<text x="179.2" y="182" font-size="13.5" class="m" fill="#2B323B">AWS</text>
<rect x="326.4" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="326.4" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">3</tspan>  <tspan font-weight="600" fill="#0B0F17">Operate</tspan></text>
<text x="326.4" y="106" font-size="13.5" fill="#5B6470">Narrow problems</text>
<text x="326.4" y="126" font-size="13.5" fill="#5B6470">down with metrics</text>
<text x="326.4" y="146" font-size="13.5" fill="#5B6470">and logs</text>
<text x="326.4" y="182" font-size="13.5" class="m" fill="#2B323B">CloudWatch</text>
<text x="326.4" y="203" font-size="13.5" class="m" fill="#2B323B">Prometheus</text>
<rect x="473.6" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="473.6" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">4</tspan>  <tspan font-weight="600" fill="#0B0F17">Automate</tspan></text>
<text x="473.6" y="106" font-size="13.5" fill="#5B6470">Make repeated work</text>
<text x="473.6" y="126" font-size="13.5" fill="#5B6470">reproducible</text>
<text x="473.6" y="182" font-size="13.5" class="m" fill="#2B323B">Git</text>
<text x="473.6" y="203" font-size="13.5" fill="#2B323B">scripts</text>
<text x="473.6" y="224" font-size="13.5" class="m" fill="#2B323B">Terraform</text>
<rect x="620.8" y="35" width="10" height="10" fill="#0B0F17"/>
<text x="620.8" y="78" font-size="16" fill="#0B0F17"><tspan font-weight="500" class="m" fill="#8A94A0">5</tspan>  <tspan font-weight="600" fill="#0B0F17">Containers</tspan></text>
<text x="620.8" y="106" font-size="13.5" fill="#5B6470">Understand runtime</text>
<text x="620.8" y="126" font-size="13.5" fill="#5B6470">and deployment</text>
<text x="620.8" y="146" font-size="13.5" fill="#5B6470">environments</text>
<text x="620.8" y="182" font-size="13.5" class="m" fill="#2B323B">Docker</text>
<text x="620.8" y="203" font-size="13.5" class="m" fill="#2B323B">Kubernetes</text>
</svg>
