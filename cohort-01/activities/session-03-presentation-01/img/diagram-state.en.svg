<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 296" role="img" aria-label="A request may be handled with a warm start, which reuses an existing runtime environment, or a cold start, which initializes a new one. An existing environment&#x27;s memory may still hold an earlier value, while a new environment starts total_orders over from 0, so state the next invocation needs is saved in DynamoDB">
