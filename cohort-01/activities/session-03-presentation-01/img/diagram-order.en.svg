<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 222" role="img" aria-label="The customer&#x27;s HTTP request, POST /orders, is received by API Gateway in the role of the kiosk, which invokes Lambda in the role of the crew member. Lambda runs validation and business logic, saves status = READY in DynamoDB in the role of the order ledger, and then responds with HTTP 201 Created">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="222" fill="#FFFFFF"/>
<text x="106" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">Customer</text>
<rect x="32" y="58" width="148" height="80" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="106" y="94.81" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">Client</text>
<text x="106" y="113.03" font-size="13" class="m" fill="#5B6470" text-anchor="middle">POST /orders</text>
<text x="302" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">Kiosk</text>
<rect x="228" y="58" width="148" height="80" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="302" y="94.81" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">API Gateway</text>
<text x="302" y="113.03" font-size="13" fill="#5B6470" text-anchor="middle">Request entry point</text>
<text x="498" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">Crew member</text>
<rect x="424" y="58" width="148" height="80" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<text x="498" y="85.7" font-size="16" font-weight="600" fill="#1160D8" text-anchor="middle">Lambda</text>
<text x="498" y="103.92" font-size="13" fill="#1160D8" text-anchor="middle">Validation and</text>
<text x="498" y="122.14" font-size="13" fill="#1160D8" text-anchor="middle">business logic</text>
<text x="694" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">Order ledger</text>
<rect x="620" y="58" width="148" height="80" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="694" y="94.81" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">DynamoDB</text>
<text x="694" y="113.03" font-size="13" class="m" fill="#5B6470" text-anchor="middle">status = READY</text>
<path d="M180 98L221.5 98" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M228 98L220.5 101.75L220.5 94.25Z" fill="#5B6470"/>
<path d="M376 98L417.5 98" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M424 98L416.5 101.75L416.5 94.25Z" fill="#5B6470"/>
<path d="M572 98L613.5 98" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M620 98L612.5 101.75L612.5 94.25Z" fill="#5B6470"/>
<path d="M498 138L498 168L106 168L106 144.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="miter"/>
<path d="M106 138L109.75 145.5L102.25 145.5Z" fill="#5B6470"/>
<text x="302" y="192" font-size="13" fill="#5B6470" text-anchor="middle"><tspan class="m">HTTP 201 Created</tspan>  sent after all processing is done</text>
</svg>
