<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 222" role="img" aria-label="손님의 HTTP 요청 POST /orders를 키오스크 역할의 API Gateway가 받아 직원 역할의 Lambda를 호출하고, Lambda가 검증과 비즈니스 로직을 실행해 주문 장부 역할의 DynamoDB에 status = READY를 저장한 뒤 HTTP 201 Created로 응답한다">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="222" fill="#FFFFFF"/>
<text x="106" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">손님</text>
<rect x="32" y="58" width="148" height="80" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="106" y="94.81" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">클라이언트</text>
<text x="106" y="113.03" font-size="13" class="m" fill="#5B6470" text-anchor="middle">POST /orders</text>
<text x="302" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">키오스크</text>
<rect x="228" y="58" width="148" height="80" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="302" y="94.81" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">API Gateway</text>
<text x="302" y="113.03" font-size="13" fill="#5B6470" text-anchor="middle">요청의 입구</text>
<text x="498" y="44" font-size="13" fill="#8A94A0" text-anchor="middle">직원</text>
<rect x="424" y="58" width="148" height="80" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<text x="498" y="85.7" font-size="16" font-weight="600" fill="#1160D8" text-anchor="middle">Lambda</text>
