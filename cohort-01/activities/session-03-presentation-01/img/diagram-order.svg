<path d="M620 98L612.5 101.75L612.5 94.25Z" fill="#5B6470"/>
<path d="M498 138L498 168L106 168L106 144.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="miter"/>
<path d="M106 138L109.75 145.5L102.25 145.5Z" fill="#5B6470"/>
<text x="302" y="192" font-size="13" fill="#5B6470" text-anchor="middle"><tspan class="m">HTTP 201 Created</tspan>  모든 처리가 끝난 뒤 응답</text>
