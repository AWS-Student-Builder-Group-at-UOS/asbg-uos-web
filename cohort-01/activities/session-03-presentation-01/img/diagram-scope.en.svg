<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" role="img" aria-label="With EC2 and Auto Scaling, the developer handles the application code, the scaling policy and instance count, and the instances and OS. With Lambda, the developer handles only the function code and settings, while AWS manages scaling to match requests and preparing the runtime environment">
