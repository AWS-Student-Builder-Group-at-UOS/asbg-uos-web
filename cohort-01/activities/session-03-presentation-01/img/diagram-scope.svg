<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 338" role="img" aria-label="EC2와 Auto Scaling에서는 개발자가 애플리케이션 코드, 확장 정책과 인스턴스 수, 인스턴스와 OS를 모두 맡는다. Lambda에서는 개발자가 함수 코드와 설정만 맡고, 요청에 맞춘 확장과 실행 환경 준비는 AWS가 관리한다">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="338" fill="#FFFFFF"/>
<text x="301" y="50" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">EC2 + Auto Scaling</text>
<text x="301" y="74" font-size="13.5" fill="#5B6470" text-anchor="middle">점주가 주방까지 직접</text>
<text x="617" y="50" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">AWS Lambda</text>
<text x="617" y="74" font-size="13.5" fill="#5B6470" text-anchor="middle">주방 운영은 전문 업체에</text>
<text x="32" y="136.55" font-size="15" font-weight="600" fill="#0B0F17">코드</text>
<rect x="150" y="98" width="302" height="66" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="301" y="127.58" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">애플리케이션 코드</text>
<text x="301" y="146.27" font-size="13.5" fill="#5B6470" text-anchor="middle">개발자</text>
<rect x="466" y="98" width="302" height="66" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<text x="617" y="127.58" font-size="16" font-weight="600" fill="#1160D8" text-anchor="middle">함수 코드와 설정</text>
<text x="617" y="146.27" font-size="13.5" fill="#1160D8" text-anchor="middle">개발자</text>
<text x="32" y="214.55" font-size="15" font-weight="600" fill="#0B0F17">확장</text>
<rect x="150" y="176" width="302" height="66" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="301" y="205.58" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">확장 정책과 인스턴스 수</text>
<text x="301" y="224.27" font-size="13.5" fill="#5B6470" text-anchor="middle">개발자가 구성</text>
<rect x="466" y="176" width="302" height="66" fill="#F4F6F8" stroke="#F4F6F8" stroke-width="1"/>
<text x="617" y="205.58" font-size="16" font-weight="600" fill="#2B323B" text-anchor="middle">요청에 맞춰 확장</text>
<text x="617" y="224.27" font-size="13.5" fill="#8A94A0" text-anchor="middle">AWS가 관리</text>
<text x="32" y="292.55" font-size="15" font-weight="600" fill="#0B0F17">실행 환경</text>
<rect x="150" y="254" width="302" height="66" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="301" y="283.57" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">인스턴스와 OS</text>
<text x="301" y="302.26" font-size="13.5" fill="#5B6470" text-anchor="middle">개발자가 관리</text>
<rect x="466" y="254" width="302" height="66" fill="#F4F6F8" stroke="#F4F6F8" stroke-width="1"/>
<text x="617" y="283.57" font-size="16" font-weight="600" fill="#2B323B" text-anchor="middle">실행 환경 준비</text>
<text x="617" y="302.26" font-size="13.5" fill="#8A94A0" text-anchor="middle">AWS가 관리</text>
</svg>
