<text x="84" y="153.92" font-size="16" font-weight="600" fill="#0B0F17" text-anchor="middle">요청</text>
<rect x="196" y="32" width="336" height="108" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="214" y="64" font-size="16" font-weight="600" fill="#0B0F17">기존 실행 환경</text>
<text x="514" y="64" font-size="13.5" fill="#5B6470" text-anchor="end">웜 스타트</text>
<text x="214" y="90" font-size="12.5" fill="#8A94A0">메모리</text>
<rect x="214" y="98" width="113.6" height="28" fill="#F4F6F8"/>
<text x="224" y="116.81" font-size="13" class="m" fill="#0B0F17">total_orders</text>
<text x="339.6" y="116.81" font-size="13" fill="#5B6470">이전 값이 남아 있을 수 있음</text>
<rect x="196" y="156" width="336" height="108" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="214" y="188" font-size="16" font-weight="600" fill="#0B0F17">새 실행 환경</text>
<text x="514" y="188" font-size="13.5" fill="#5B6470" text-anchor="end">콜드 스타트</text>
<text x="214" y="214" font-size="12.5" fill="#8A94A0">메모리</text>
<rect x="214" y="222" width="144.8" height="28" fill="#F4F6F8"/>
<text x="224" y="240.81" font-size="13" class="m" fill="#0B0F17">total_orders = 0</text>
<text x="370.8" y="240.81" font-size="13" fill="#5B6470">처음 값부터 다시 시작</text>
