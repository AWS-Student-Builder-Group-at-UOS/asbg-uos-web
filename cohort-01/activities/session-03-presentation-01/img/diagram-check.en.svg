<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-label="A request from the sign-up page goes through API Gateway, is handled by RegisterFunction, is saved in RegistrationsTable, and comes back as a 201 response. Using the same registration ID, check the response code and badge code on the page, the four records in the RegisterFunction logs, and status = ISSUED and badgeCode in the DynamoDB item">
