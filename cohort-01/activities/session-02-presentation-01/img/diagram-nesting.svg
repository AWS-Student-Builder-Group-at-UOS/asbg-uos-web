<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-label="AWS 안에 VPC, VPC 안에 퍼블릭 서브넷과 프라이빗 서브넷, 서브넷 안에 EC2가 들어 있고, 인터넷은 IGW를 거쳐 퍼블릭 서브넷과만 직접 통신한다">
<style>
