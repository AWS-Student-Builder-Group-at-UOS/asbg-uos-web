<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" role="img" aria-label="AWS contains a VPC, the VPC contains a public and a private subnet, and each subnet holds an EC2 instance; the internet talks directly only to the public subnet, through the IGW">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="404" fill="#FFFFFF"/>
<rect x="32" y="96" width="736" height="282" fill="#F4F6F8"/>
<text x="48" y="120" font-size="13" font-weight="600" fill="#5B6470">AWS Cloud</text>
<rect x="52" y="140" width="696" height="218" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="72" y="186" font-size="14" fill="#0B0F17"><tspan font-weight="700" fill="#0B0F17">VPC</tspan>  <tspan font-size="13" fill="#5B6470">a virtual network you own</tspan></text>
<rect x="72" y="222" width="320" height="112" fill="#F4F6F8"/>
<text x="90" y="252" font-size="14" font-weight="700" fill="#0B0F17">Public subnet</text>
<text x="90" y="276" font-size="13" fill="#5B6470">talks to the</text>
<text x="90" y="295" font-size="13" fill="#5B6470">internet directly</text>
<rect x="274" y="256" width="100" height="44" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="324" y="283.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">EC2</text>
<rect x="408" y="222" width="320" height="112" fill="#F4F6F8"/>
<text x="426" y="252" font-size="14" font-weight="700" fill="#0B0F17">Private subnet</text>
<text x="426" y="276" font-size="13" fill="#5B6470">can't be reached from</text>
<text x="426" y="295" font-size="13" fill="#5B6470">the internet directly</text>
<rect x="610" y="256" width="100" height="44" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="660" y="283.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">EC2</text>
<rect x="264" y="24" width="120" height="36" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="324" y="47.18" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">Internet</text>
<rect x="248" y="116" width="152" height="48" fill="#FFFFFF" stroke="#1160D8" stroke-width="1"/>
<text x="324" y="138.41" font-size="15" font-weight="700" fill="#0B0F17" text-anchor="middle">IGW</text>
<text x="324" y="152.69" font-size="12" fill="#5B6470" text-anchor="middle">internet gateway</text>
