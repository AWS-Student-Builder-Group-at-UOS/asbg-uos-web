<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="index.html이 내 PC에서 scp로 EC2의 /home/ec2-user로 옮겨지고, sudo mv로 Nginx 웹 폴더에 놓인 뒤, Nginx가 80번 포트로 브라우저에 전달하기까지. 그 전에 내 PC 창에서 키 권한을 좁히고 SSH로 접속한 뒤, EC2 창에서 Nginx를 설치하고 실행한다">
<style>
@font-face{font-family:"d-mono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="420" fill="#FFFFFF"/>
<rect x="173.33" y="32" width="125.34" height="46" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="236" y="52" font-size="14" font-weight="700" fill="#0B0F17" text-anchor="middle">내 PC 창</text>
<text x="236" y="69" font-size="12" fill="#5B6470" text-anchor="middle">PowerShell, 터미널</text>
<path d="M236 78L236 404" fill="none" stroke="#C5CCD4" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="433.54" y="32" width="108.93" height="46" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="488" y="52" font-size="14" font-weight="700" fill="#0B0F17" text-anchor="middle">EC2 창</text>
<text x="488" y="69" font-size="12" fill="#5B6470" text-anchor="middle">SSH로 접속한 창</text>
<path d="M488 78L488 404" fill="none" stroke="#C5CCD4" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="665.8" y="32" width="76.4" height="46" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="704" y="52" font-size="14" font-weight="700" fill="#0B0F17" text-anchor="middle">브라우저</text>
<text x="704" y="69" font-size="12" fill="#5B6470" text-anchor="middle">누구나</text>
<path d="M704 78L704 404" fill="none" stroke="#C5CCD4" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M32 266L768 266" fill="none" stroke="#E3E7EC" stroke-width="1"/>
<text x="32" y="110" font-size="14" font-weight="700" fill="#0B0F17">준비</text>
<text x="32" y="129" font-size="12" fill="#5B6470">접속하고 Nginx 켜기</text>
<text x="32" y="298" font-size="14" font-weight="700" fill="#0B0F17">배포</text>
<text x="32" y="317" font-size="12" fill="#5B6470">파일 옮기고 열기</text>
<rect x="192.25" y="99" width="87.5" height="26" fill="#F4F6F8"/>
<text x="202.25" y="116.62" font-size="12.5" class="m" fill="#0B0F17">chmod 400</text>
<text x="289.75" y="116.62" font-size="12.5" fill="#5B6470">키 권한 좁히기</text>
<path d="M236 152L481.5 152" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M488 152L480.5 155.75L480.5 148.25Z" fill="#5B6470"/>
<text x="362" y="144" font-size="12.5" class="m" fill="#0B0F17" text-anchor="middle">ssh ec2-user@PUBLIC_IP</text>
<text x="362" y="170" font-size="12" fill="#5B6470" text-anchor="middle">접속</text>
<rect x="384.25" y="179" width="207.5" height="26" fill="#F4F6F8"/>
<text x="394.25" y="196.62" font-size="12.5" class="m" fill="#0B0F17">sudo dnf install -y nginx</text>
<text x="601.75" y="196.62" font-size="12.5" fill="#5B6470">설치</text>
<rect x="380.5" y="219" width="215" height="26" fill="#F4F6F8"/>
<text x="390.5" y="236.62" font-size="12.5" class="m" fill="#0B0F17">sudo systemctl start nginx</text>
<text x="605.5" y="236.62" font-size="12.5" fill="#5B6470">실행</text>
<path d="M236 300L481.5 300" fill="none" stroke="#1160D8" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M488 300L480.5 303.75L480.5 296.25Z" fill="#1160D8"/>
<text x="362" y="292" font-size="12.5" class="m" fill="#0B0F17" text-anchor="middle">scp index.html</text>
<text x="362" y="318" font-size="12" fill="#5B6470" text-anchor="middle">새 터미널에서 홈 폴더로</text>
<rect x="324.25" y="327" width="327.5" height="26" fill="#EDF3FC" stroke="#1160D8" stroke-width="1"/>
<text x="334.25" y="344.62" font-size="12.5" class="m" fill="#0B0F17">sudo mv index.html /usr/share/nginx/html/</text>
<path d="M488 380L697.5 380" fill="none" stroke="#1160D8" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M704 380L696.5 383.75L696.5 376.25Z" fill="#1160D8"/>
<text x="596" y="372" font-size="12.5" class="m" fill="#0B0F17" text-anchor="middle">http://PUBLIC_IP</text>
<text x="596" y="398" font-size="12" fill="#5B6470" text-anchor="middle">80번 포트로 전달</text>
</svg>
