<text x="433.71" y="57.18" font-size="14" font-weight="600" fill="#0B0F17">Internet gateway</text>
<rect x="242" y="102" width="316" height="198" fill="#E8ECF0"/>
<rect x="256" y="116" width="20" height="20" fill="#0B0F17"/>
<text x="266" y="130.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
