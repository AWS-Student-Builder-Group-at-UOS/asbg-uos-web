<rect x="264" y="150" width="272" height="132" fill="#FFFFFF" stroke="#1160D8" stroke-width="1.5"/>
<rect x="278" y="164" width="20" height="20" fill="#1160D8"/>
<text x="288" y="178.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="306" y="178" font-size="14.5" font-weight="700" fill="#1160D8">Security group</text>
<rect x="325" y="202" width="150" height="50" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<rect x="370" y="218" width="20" height="20" fill="#1160D8"/>
<text x="380" y="232.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="396" y="232.55" font-size="15" font-weight="700" fill="#1160D8">EC2</text>
<path d="M176 58L176 245.5" fill="none" stroke="#0B0F17" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M176 252L172.25 244.5L179.75 244.5Z" fill="#0B0F17"/>
<text x="160" y="72" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="end">Build</text>
<text x="160" y="92" font-size="13" fill="#5B6470" text-anchor="end">outside in</text>
<path d="M624 252L624 64.5" fill="none" stroke="#0B0F17" stroke-width="1.5" stroke-linejoin="miter"/>
