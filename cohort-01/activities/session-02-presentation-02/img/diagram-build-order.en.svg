<text x="640" y="72" font-size="14.5" font-weight="700" fill="#0B0F17">Delete</text>
<text x="640" y="92" font-size="13" fill="#5B6470">inside out</text>
<text x="640" y="209" font-size="12" fill="#8A94A0">An outer resource</text>
