<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-label="Build an EC2 instance from the outside in: VPC, internet gateway, subnet, security group, EC2; delete in reverse. The Seoul region&#x27;s default VPC already has the first three, so the lab started from the security group">
<style>
@font-face{font-family:"d-mono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
