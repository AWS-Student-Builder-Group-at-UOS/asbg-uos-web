<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 276" role="img" aria-label="User, external load balancer, WEB, APP and DB in a chain; each tier&#x27;s security group only allows traffic from the tier right before it, so the user can&#x27;t reach the DB directly">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="276" fill="#FFFFFF"/>
<rect x="32" y="108" width="70" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="67" y="132.54" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">User</text>
<text x="67" y="149.82" font-size="12" fill="#5B6470" text-anchor="middle">browser</text>
<rect x="121" y="92" width="146" height="88" fill="none" stroke="#1160D8" stroke-width="1.25" stroke-dasharray="5 3"/>
<rect x="133" y="108" width="122" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="194" y="133.49" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">External LB</text>
<text x="194" y="149.24" font-size="12.5" fill="#5B6470" text-anchor="middle">ALB</text>
<path d="M102 136L126.5 136" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M133 136L125.5 139.75L125.5 132.25Z" fill="#5B6470"/>
<text x="121" y="204" font-size="12" font-weight="600" fill="#1160D8">allows</text>
<text x="121" y="224" font-size="13" fill="#2B323B">web traffic from users</text>
<rect x="286" y="92" width="146" height="88" fill="none" stroke="#1160D8" stroke-width="1.25" stroke-dasharray="5 3"/>
<rect x="298" y="108" width="122" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="359" y="133.49" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">WEB</text>
<text x="359" y="149.24" font-size="12.5" fill="#5B6470" text-anchor="middle">Nginx</text>
<path d="M255 136L291.5 136" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M298 136L290.5 139.75L290.5 132.25Z" fill="#5B6470"/>
<text x="286" y="204" font-size="12" font-weight="600" fill="#1160D8">allows</text>
<text x="286" y="224" font-size="13" fill="#2B323B">requests from the</text>
<text x="286" y="243" font-size="13" fill="#2B323B">external LB</text>
<rect x="451" y="92" width="146" height="88" fill="none" stroke="#1160D8" stroke-width="1.25" stroke-dasharray="5 3"/>
<rect x="463" y="108" width="122" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="524" y="133.49" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">APP</text>
<text x="524" y="149.24" font-size="12.5" fill="#5B6470" text-anchor="middle">Spring Boot</text>
<path d="M420 136L456.5 136" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M463 136L455.5 139.75L455.5 132.25Z" fill="#5B6470"/>
<text x="451" y="204" font-size="12" font-weight="600" fill="#1160D8">allows</text>
<text x="451" y="224" font-size="13" fill="#2B323B">requests from WEB</text>
<text x="451" y="243" font-size="13" fill="#2B323B">or an internal LB</text>
<rect x="616" y="92" width="146" height="88" fill="none" stroke="#1160D8" stroke-width="1.25" stroke-dasharray="5 3"/>
<rect x="628" y="108" width="122" height="56" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="689" y="133.49" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">DB</text>
<text x="689" y="149.24" font-size="12.5" fill="#5B6470" text-anchor="middle">MySQL</text>
<path d="M585 136L621.5 136" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M628 136L620.5 139.75L620.5 132.25Z" fill="#5B6470"/>
<text x="616" y="204" font-size="12" font-weight="600" fill="#1160D8">allows</text>
<text x="616" y="224" font-size="13" fill="#2B323B">DB-port traffic from APP</text>
<rect x="32" y="30" width="16" height="12" fill="none" stroke="#1160D8" stroke-width="1.25" stroke-dasharray="5 3"/>
<text x="56" y="41" font-size="12.5" fill="#1160D8">security group</text>
<path d="M67 108V66H689V82" fill="none" stroke="#8A94A0" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M683.5 80.5L694.5 91.5M694.5 80.5L683.5 91.5" fill="none" stroke="#0B0F17" stroke-width="2"/>
<text x="675" y="58" font-size="12.5" fill="#5B6470" text-anchor="end">No direct path from the user to the DB</text>
</svg>
