<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" role="img" aria-label="Four roles in handling more traffic">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="900" height="535" fill="#F2FAFF"/>
<rect x="1" y="1" width="898" height="533" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif" fill="#123249"><text x="36" y="52" font-size="29" font-weight="700">Four roles in handling more traffic</text>
<rect x="36" y="94" width="396" height="173" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="56" y="132" font-size="25" fill="#123249" font-weight="700">ALB</text>
<text x="56" y="167" font-size="21" fill="#35526A" font-weight="400">Distribute requests</text>
<text x="56" y="197" font-size="21" fill="#35526A" font-weight="400">Check target health</text>
<rect x="468" y="94" width="396" height="173" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="488" y="132" font-size="25" fill="#123249" font-weight="700">Auto Scaling</text>
<text x="488" y="167" font-size="21" fill="#35526A" font-weight="400">Adjust instance capacity</text>
<text x="488" y="197" font-size="21" fill="#35526A" font-weight="400">Use health checks and metrics</text>
<rect x="36" y="299" width="396" height="173" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="56" y="337" font-size="25" fill="#123249" font-weight="700">CloudFront</text>
<text x="56" y="372" font-size="21" fill="#35526A" font-weight="400">Cache suitable responses</text>
<text x="56" y="402" font-size="21" fill="#35526A" font-weight="400">Serve content near users</text>
<rect x="468" y="299" width="396" height="173" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="488" y="337" font-size="25" fill="#123249" font-weight="700">ElastiCache</text>
<text x="488" y="372" font-size="21" fill="#35526A" font-weight="400">Reuse application query results</text>
<text x="488" y="402" font-size="21" fill="#35526A" font-weight="400">Define expiry and invalidation</text>
<text x="36" y="510" font-size="22" fill="#35526A" font-weight="400">Distribution, capacity, and caching solve different problems.</text>
