<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 336" role="img" aria-label="One server where WEB, APP and DB share CPU, memory and disk, compared with a 3-tier setup that splits the roles into presentation, application and data tiers, each with its own resources">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="336" fill="#FFFFFF"/>
<text x="32" y="42" font-size="16" font-weight="700" fill="#0B0F17">One server</text>
<text x="432" y="42" font-size="16" font-weight="700" fill="#0B0F17">3-Tier</text>
<rect x="32" y="58" width="304" height="226" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<rect x="48" y="74" width="272" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="62" y="99.55" font-size="15" fill="#0B0F17"><tspan font-weight="700" fill="#0B0F17">WEB</tspan>  <tspan font-size="13" fill="#5B6470">Nginx</tspan></text>
<rect x="48" y="126" width="272" height="40" fill="#FFFFFF" stroke="#1160D8" stroke-width="1.5"/>
<text x="62" y="151.55" font-size="15" fill="#0B0F17"><tspan font-weight="700" fill="#1160D8">APP</tspan>  <tspan font-size="13" fill="#5B6470">Spring Boot</tspan></text>
<rect x="48" y="178" width="272" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="62" y="203.55" font-size="15" fill="#0B0F17"><tspan font-weight="700" fill="#0B0F17">DB</tspan>  <tspan font-size="13" fill="#5B6470">MySQL</tspan></text>
<rect x="48" y="236" width="272" height="32" fill="#F4F6F8"/>
<text x="184" y="256.81" font-size="13" fill="#2B323B" text-anchor="middle">All three share CPU, memory, disk</text>
<text x="32" y="312" font-size="13.5" fill="#5B6470">A busy APP slows WEB and DB down too</text>
<path d="M356 171L405.5 171" fill="none" stroke="#8A94A0" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M412 171L404.5 174.75L404.5 167.25Z" fill="#8A94A0"/>
<text x="384" y="160" font-size="12.5" fill="#5B6470" text-anchor="middle">Split</text>
<rect x="432" y="58" width="336" height="56" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="448" y="82" font-size="15" fill="#0B0F17"><tspan font-weight="700">WEB</tspan>  <tspan font-size="13" fill="#5B6470">Nginx</tspan></text>
<text x="448" y="102" font-size="12" fill="#8A94A0">Presentation tier</text>
<rect x="629.62" y="72" width="126.38" height="28" fill="#F4F6F8"/>
<text x="639.62" y="90.62" font-size="12.5" fill="#2B323B">CPU, memory, disk</text>
<path d="M472 114L472 136.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M472 143L468.25 135.5L475.75 135.5Z" fill="#5B6470"/>
<rect x="432" y="143" width="336" height="56" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="448" y="167" font-size="15" fill="#0B0F17"><tspan font-weight="700">APP</tspan>  <tspan font-size="13" fill="#5B6470">Spring Boot</tspan></text>
<text x="448" y="187" font-size="12" fill="#8A94A0">Application tier, WAS</text>
<rect x="629.62" y="157" width="126.38" height="28" fill="#F4F6F8"/>
<text x="639.62" y="175.62" font-size="12.5" fill="#2B323B">CPU, memory, disk</text>
<path d="M472 199L472 221.5" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M472 228L468.25 220.5L475.75 220.5Z" fill="#5B6470"/>
<rect x="432" y="228" width="336" height="56" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="448" y="252" font-size="15" fill="#0B0F17"><tspan font-weight="700">DB</tspan>  <tspan font-size="13" fill="#5B6470">MySQL</tspan></text>
<text x="448" y="272" font-size="12" fill="#8A94A0">Data tier</text>
<rect x="629.62" y="242" width="126.38" height="28" fill="#F4F6F8"/>
<text x="639.62" y="260.62" font-size="12.5" fill="#2B323B">CPU, memory, disk</text>
<text x="432" y="312" font-size="13.5" fill="#5B6470">Each tier has its own runtime and resources</text>
</svg>
