<text x="80" y="212" font-size="13" text-anchor="middle" fill="#35526A">Nginx</text>
<text x="80" y="300" font-size="13" text-anchor="middle" fill="#35526A">1대 · 그대로</text>

<line x1="124" y1="197" x2="152" y2="197" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="156" y="175" width="84" height="44" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="198" y="202" font-size="13" font-weight="700" text-anchor="middle" fill="#123249">로드밸런서</text>

<rect x="276" y="108" width="216" height="164" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<text x="286" y="124" font-size="12" fill="#35526A">Auto Scaling · 조건에 따라 대수 조절</text>
<rect x="298" y="136" width="172" height="34" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="384" y="158" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#123249">APP</tspan><tspan fill="#35526A"> · Spring Boot</tspan></text>
<rect x="298" y="180" width="172" height="34" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="384" y="202" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#123249">APP</tspan><tspan fill="#35526A"> · Spring Boot</tspan></text>
<rect x="298" y="224" width="172" height="34" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="384" y="246" font-size="14" text-anchor="middle"><tspan font-weight="700" fill="#123249">APP</tspan><tspan fill="#35526A"> · Spring Boot</tspan></text>
<text x="384" y="300" font-size="14" font-weight="700" text-anchor="middle" fill="#1160D8">1대 → 3대</text>

<line x1="240" y1="197" x2="294" y2="153" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="240" y1="197" x2="294" y2="197" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="240" y1="197" x2="294" y2="241" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>

<line x1="470" y1="153" x2="524" y2="176" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="470" y1="197" x2="524" y2="197" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="470" y1="241" x2="524" y2="218" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="528" y="162" width="88" height="70" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="572" y="193" font-size="15" font-weight="700" text-anchor="middle" fill="#123249">DB</text>
<text x="572" y="212" font-size="13" text-anchor="middle" fill="#35526A">MySQL</text>
<text x="572" y="300" font-size="13" text-anchor="middle" fill="#35526A">1대 · 그대로</text>

<line x1="644" y1="108" x2="644" y2="316" stroke="#D9E7F0"/>

<text x="672" y="122" font-size="14" font-weight="700" fill="#123249">Scale Up</text>
