<text x="694" y="164" font-size="12" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
<line x1="716" y1="160" x2="750" y2="160" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="754" y="132" width="88" height="56" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="798" y="165" font-size="15" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
<text x="672" y="210" font-size="13" fill="#35526A">서버 사양(CPU·메모리)을 키운다</text>

<text x="672" y="246" font-size="14" font-weight="700" fill="#123249">Scale Out</text>
<rect x="672" y="260" width="44" height="30" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="694" y="279" font-size="12" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
<line x1="716" y1="275" x2="750" y2="275" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="754" y="260" width="44" height="30" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="776" y="279" font-size="12" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
<rect x="806" y="260" width="44" height="30" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="828" y="279" font-size="12" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
<rect x="858" y="260" width="44" height="30" fill="#DCEFFF" stroke="#79CDFF"/>
<text x="880" y="279" font-size="12" font-weight="700" text-anchor="middle" fill="#123249">APP</text>
