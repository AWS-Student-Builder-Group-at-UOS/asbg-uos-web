<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-label="APP 계층만 1대에서 3대로 늘리고 WEB과 DB는 그대로 둔다. 서버 사양을 키우는 Scale Up과 서버 수를 늘리는 Scale Out의 차이">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="388" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="386" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">바쁜 계층만 늘린다</text>
<text x="36" y="74" font-size="15" fill="#35526A">APP만 1대에서 3대로, WEB과 DB는 그대로</text>

<rect x="36" y="162" width="88" height="70" fill="#FFFFFF" stroke="#79CDFF"/>
