<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" role="img" aria-label="EC2를 만드는 순서는 VPC, 인터넷 게이트웨이, 서브넷, 보안 그룹, EC2로 바깥에서 안으로 들어가고, 지우는 순서는 그 역순이다. 서울 리전 기본 VPC가 앞의 세 단계를 이미 갖추고 있어 실습은 보안 그룹부터 직접 만들었다">
<style>
@font-face{font-family:"d-mono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="396" fill="#FFFFFF"/>
<rect x="220" y="52" width="360" height="266" fill="#F4F6F8" stroke="#C5CCD4" stroke-width="1"/>
<rect x="234" y="66" width="20" height="20" fill="#0B0F17"/>
<text x="244" y="80.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="262" y="80" font-size="14.5" font-weight="700" fill="#0B0F17">VPC</text>
<rect x="405.87" y="34" width="158.13" height="36" fill="#F4F6F8" stroke="#C5CCD4" stroke-width="1"/>
<rect x="415.87" y="43" width="20" height="20" fill="#0B0F17"/>
<text x="425.87" y="57.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="443.87" y="57.18" font-size="14" font-weight="600" fill="#0B0F17">인터넷 게이트웨이</text>
<rect x="242" y="102" width="316" height="198" fill="#E8ECF0"/>
<rect x="256" y="116" width="20" height="20" fill="#0B0F17"/>
<text x="266" y="130.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="284" y="130" font-size="14.5" font-weight="700" fill="#0B0F17">서브넷</text>
<rect x="264" y="150" width="272" height="132" fill="#FFFFFF" stroke="#1160D8" stroke-width="1.5"/>
<rect x="278" y="164" width="20" height="20" fill="#1160D8"/>
<text x="288" y="178.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="306" y="178" font-size="14.5" font-weight="700" fill="#1160D8">보안 그룹</text>
<rect x="325" y="202" width="150" height="50" fill="#EDF3FC" stroke="#1160D8" stroke-width="1.5"/>
<rect x="370" y="218" width="20" height="20" fill="#1160D8"/>
<text x="380" y="232.6" font-size="13" font-weight="600" class="m" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="396" y="232.55" font-size="15" font-weight="700" fill="#1160D8">EC2</text>
<path d="M176 58L176 245.5" fill="none" stroke="#0B0F17" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M176 252L172.25 244.5L179.75 244.5Z" fill="#0B0F17"/>
<text x="160" y="72" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="end">만들 때</text>
<text x="160" y="92" font-size="13" fill="#5B6470" text-anchor="end">바깥에서 안으로</text>
<path d="M624 252L624 64.5" fill="none" stroke="#0B0F17" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M624 58L627.75 65.5L620.25 65.5Z" fill="#0B0F17"/>
<text x="640" y="72" font-size="14.5" font-weight="700" fill="#0B0F17">지울 때</text>
<text x="640" y="92" font-size="13" fill="#5B6470">안에서 바깥으로</text>
<text x="640" y="226" font-size="12" fill="#8A94A0">안에 리소스가 남아 있으면</text>
<text x="640" y="243" font-size="12" fill="#8A94A0">바깥은 지워지지 않는다</text>
<rect x="220" y="341" width="16" height="14" fill="#F4F6F8" stroke="#C5CCD4" stroke-width="1"/>
<text x="244" y="352" font-size="13" fill="#0B0F17"><tspan font-weight="600" fill="#5B6470">1~3  </tspan><tspan fill="#2B323B">서울 리전 기본 VPC에 이미 있다</tspan></text>
<rect x="469.91" y="341" width="16" height="14" fill="#FFFFFF" stroke="#1160D8" stroke-width="1.5"/>
<text x="493.91" y="352" font-size="13" fill="#0B0F17"><tspan font-weight="600" fill="#1160D8">4, 5  </tspan><tspan fill="#2B323B">이번 실습에서 직접 만든 것</tspan></text>
</svg>
