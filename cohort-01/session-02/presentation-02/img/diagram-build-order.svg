<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" aria-label="EC2를 만드는 순서는 VPC, 인터넷 게이트웨이, 서브넷, 보안 그룹, EC2로 바깥에서 안으로 들어가고, 지우는 순서는 그 역순이다. 서울 리전 기본 VPC가 앞의 세 단계를 이미 갖추고 있어 실습은 보안 그룹부터 직접 만들었다">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="456" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="454" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">만들 땐 바깥에서 안으로, 지울 땐 안에서 바깥으로</text>
<text x="36" y="74" font-size="15" fill="#35526A">해체는 조립의 역순</text>

<rect x="36" y="130" width="384" height="260" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<rect x="46" y="140" width="20" height="20" fill="#1160D8"/>
<text x="56" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="74" y="155" font-size="13" font-weight="700" fill="#123249">VPC</text>

<rect x="138" y="112" width="180" height="36" fill="#FFFFFF" stroke="#79CDFF"/>
<rect x="148" y="120" width="20" height="20" fill="#1160D8"/>
<text x="158" y="134" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="176" y="135" font-size="13" font-weight="700" fill="#123249">인터넷 게이트웨이</text>

<rect x="60" y="170" width="336" height="200" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<rect x="70" y="180" width="20" height="20" fill="#1160D8"/>
<text x="80" y="194" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="98" y="195" font-size="13" font-weight="700" fill="#123249">서브넷</text>

<rect x="84" y="210" width="288" height="140" fill="none" stroke="#1160D8"/>
<rect x="94" y="220" width="20" height="20" fill="#1160D8"/>
<text x="104" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="122" y="235" font-size="13" font-weight="700" fill="#123249">보안 그룹</text>

<rect x="148" y="256" width="160" height="64" fill="#DCEFFF" stroke="#1160D8"/>
<rect x="198" y="278" width="20" height="20" fill="#1160D8"/>
<text x="208" y="292" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="226" y="294" font-size="16" font-weight="700" fill="#123249">EC2</text>

<text x="520" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#123249">만들 때</text>
<text x="520" y="127" font-size="12" text-anchor="middle" fill="#35526A">바깥 → 안</text>
<text x="836" y="110" font-size="14" font-weight="700" text-anchor="middle" fill="#123249">지울 때</text>
<text x="836" y="127" font-size="12" text-anchor="middle" fill="#35526A">안 → 바깥</text>
<line x1="520" y1="140" x2="520" y2="390" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="836" y1="392" x2="836" y2="142" stroke="#79CDFF" stroke-width="3" marker-end="url(#arrow)"/>
<text x="508" y="182" font-size="12" font-weight="700" text-anchor="end" fill="#1160D8">처음</text>
<text x="508" y="376" font-size="12" text-anchor="end" fill="#35526A">마지막</text>
<text x="848" y="376" font-size="12" font-weight="700" fill="#1160D8">처음</text>
<text x="848" y="182" font-size="12" fill="#35526A">마지막</text>
<rect x="548" y="136" width="264" height="144" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<text x="556" y="153" font-size="12" fill="#35526A">서울 리전 기본 VPC에 이미 있음</text>
<rect x="556" y="162" width="248" height="30" fill="#FFFFFF" stroke="#79CDFF"/>
<rect x="564" y="167" width="20" height="20" fill="#1160D8"/><text x="574" y="181" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="594" y="182" font-size="13" font-weight="700" fill="#123249">VPC</text>
<rect x="556" y="200" width="248" height="30" fill="#FFFFFF" stroke="#79CDFF"/>
<rect x="564" y="205" width="20" height="20" fill="#1160D8"/><text x="574" y="219" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="594" y="220" font-size="13" font-weight="700" fill="#123249">인터넷 게이트웨이</text>
<rect x="556" y="238" width="248" height="30" fill="#FFFFFF" stroke="#79CDFF"/>
<rect x="564" y="243" width="20" height="20" fill="#1160D8"/><text x="574" y="257" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="594" y="258" font-size="13" font-weight="700" fill="#123249">서브넷</text>
<rect x="548" y="292" width="264" height="104" fill="none" stroke="#1160D8"/>
<text x="556" y="309" font-size="12" font-weight="700" fill="#1160D8">이번 실습에서 직접 만든 것</text>
<rect x="556" y="318" width="248" height="30" fill="#DCEFFF" stroke="#1160D8"/>
<rect x="564" y="323" width="20" height="20" fill="#1160D8"/><text x="574" y="337" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="594" y="338" font-size="13" font-weight="700" fill="#123249">보안 그룹</text>
<rect x="556" y="356" width="248" height="30" fill="#DCEFFF" stroke="#1160D8"/>
<rect x="564" y="361" width="20" height="20" fill="#1160D8"/><text x="574" y="375" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
<text x="594" y="376" font-size="13" font-weight="700" fill="#123249">EC2</text>

<text x="36" y="426" font-size="14" font-weight="700" fill="#1160D8">안에 리소스가 남아 있으면 바깥 리소스는 지워지지 않는다</text>
</g>
</svg>
