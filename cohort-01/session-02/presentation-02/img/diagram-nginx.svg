<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="브라우저가 EC2의 80번 포트로 HTTP 요청을 보내면, 80번 포트에서 실행 중인 Nginx가 /usr/share/nginx/html의 정적 파일을 읽어 브라우저에 응답한다">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="400" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="398" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">파일만 올려 두면 아무도 볼 수 없다</text>
<text x="36" y="74" font-size="15" fill="#35526A">HTML · CSS · JavaScript 파일은 스스로 응답하지 못한다</text>

<rect x="36" y="190" width="160" height="110" fill="#FFFFFF" stroke="#79CDFF"/>
<line x1="36" y1="210" x2="196" y2="210" stroke="#79CDFF"/>
<rect x="46" y="197" width="6" height="6" fill="#79CDFF"/>
<rect x="56" y="197" width="6" height="6" fill="#79CDFF"/>
<rect x="66" y="197" width="6" height="6" fill="#79CDFF"/>
<text x="116" y="244" font-size="12" text-anchor="middle" fill="#35526A">외부 사용자</text>
<text x="116" y="268" font-size="15" font-weight="700" text-anchor="middle" fill="#123249">사용자 웹브라우저</text>

<rect x="334" y="104" width="590" height="224" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="352" y="132" font-size="15" font-weight="700" fill="#123249">EC2 인스턴스<tspan font-size="13" font-weight="400" fill="#35526A">  =  인터넷에 연결된 컴퓨터 한 대</tspan></text>

<rect x="370" y="148" width="230" height="160" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<text x="378" y="164" font-size="12" fill="#35526A">실행 중인 프로그램 (프로세스)</text>
<rect x="400" y="176" width="170" height="108" fill="#DCEFFF" stroke="#1160D8"/>
<text x="485" y="204" font-size="15" font-weight="700" text-anchor="middle" fill="#123249">웹 서버 프로그램</text>
<text x="485" y="226" font-size="13" text-anchor="middle" fill="#35526A">Nginx · Apache</text>
<rect x="423" y="244" width="124" height="24" fill="#FFFFFF" stroke="#1160D8"/>
<text x="485" y="260" font-size="12" font-weight="700" text-anchor="middle" fill="#1160D8">실행 중 · 80번 포트</text>

<rect x="672" y="148" width="236" height="160" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<text x="680" y="164" font-size="12" fill="#35526A">저장된 파일 (디스크)</text>
<text x="684" y="192" font-size="13" font-weight="700" fill="#123249">/usr/share/nginx/html</text>
<path d="M692 200 V280 M692 216 H704 M692 248 H704 M692 280 H704" fill="none" stroke="#79CDFF"/>
<rect x="704" y="204" width="172" height="24" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="716" y="220" font-size="13" fill="#123249">index.html</text>
<rect x="704" y="236" width="172" height="24" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="716" y="252" font-size="13" fill="#123249">CSS</text>
<rect x="704" y="268" width="172" height="24" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="716" y="284" font-size="13" fill="#123249">JavaScript</text>

<line x1="196" y1="230" x2="312" y2="230" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="254" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#1160D8">① 요청 · HTTP</text>
<rect x="316" y="216" width="36" height="28" fill="#1160D8"/>
<text x="334" y="235" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">80</text>
<line x1="352" y1="230" x2="396" y2="230" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>

<line x1="570" y1="230" x2="668" y2="230" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="635" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#1160D8">② 읽기</text>

<line x1="400" y1="268" x2="200" y2="268" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262" y="290" font-size="13" font-weight="700" text-anchor="middle" fill="#1160D8">③ 응답 · 파일 전달</text>

<text x="36" y="370" font-size="14" font-weight="700" fill="#1160D8">요청을 받아 파일을 전달할 웹 서버(Nginx)가 있어야 한다</text>
</g>
</svg>
