<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="NACL은 서브넷 입구에서 들어오는 요청과 나가는 응답을 각각 규칙으로 검사하고, 보안 그룹은 인스턴스 앞에서 허용한 요청의 응답을 자동으로 통과시킨다">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#1160D8" stroke-width="1.6"/></marker></defs>
<rect width="960" height="440" fill="#F2FAFF"/>
<rect x="1" y="1" width="958" height="438" fill="none" stroke="#D9E7F0"/>
<g font-family="Arial, sans-serif">
<text x="36" y="46" font-size="24" font-weight="700" fill="#123249">NACL은 서브넷을, 보안 그룹은 인스턴스를 지킨다</text>
<text x="36" y="74" font-size="15" fill="#35526A">둘 다 경호원, 지키는 단위와 방식이 다르다</text>

<rect x="216" y="100" width="708" height="204" fill="none" stroke="#79CDFF" stroke-dasharray="4 3"/>
<text x="254" y="119" font-size="12" font-weight="700" fill="#35526A">서브넷</text>

<rect x="36" y="144" width="90" height="116" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="81" y="202" font-size="16" font-weight="700" text-anchor="middle" fill="#123249">외부</text>
<text x="81" y="222" font-size="12" text-anchor="middle" fill="#35526A">인터넷</text>

<rect x="190" y="114" width="52" height="176" fill="#DCEFFF" stroke="#1160D8"/>
<text x="216" y="207" font-size="14" font-weight="700" text-anchor="middle" fill="#1160D8">NACL</text>

<rect x="560" y="116" width="340" height="172" fill="none" stroke="#1160D8"/>
<text x="572" y="134" font-size="12" font-weight="700" fill="#1160D8">보안 그룹</text>
<rect x="700" y="144" width="160" height="116" fill="#FFFFFF" stroke="#79CDFF"/>
<text x="780" y="202" font-size="16" font-weight="700" text-anchor="middle" fill="#123249">EC2</text>
<text x="780" y="222" font-size="12" text-anchor="middle" fill="#35526A">인스턴스</text>

<text x="140" y="162" font-size="13" font-weight="700" fill="#123249">요청</text>
<line x1="126" y1="172" x2="186" y2="172" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="242" y1="172" x2="556" y2="172" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="172" x2="696" y2="172" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="254" y="162" font-size="12" fill="#1160D8">인바운드 규칙 검사</text>
<text x="572" y="162" font-size="12" fill="#1160D8">인바운드 허용?</text>

<text x="140" y="252" font-size="13" font-weight="700" fill="#123249">응답</text>
<line x1="700" y1="232" x2="564" y2="232" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="232" x2="246" y2="232" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="190" y1="232" x2="130" y2="232" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="254" y="252" font-size="12" fill="#1160D8">아웃바운드 규칙 따로 검사 · Stateless</text>
<text x="572" y="252" font-size="12" fill="#1160D8">자동 허용 · Stateful</text>

<rect x="36" y="328" width="434" height="72" fill="#FFFFFF" stroke="#79CDFF"/><rect x="36" y="328" width="6" height="72" fill="#79CDFF"/>
<text x="58" y="369" font-size="15" font-weight="700" fill="#123249">NACL</text>
<text x="166" y="357" font-size="13" fill="#35526A">서브넷 단위 · 하위 인스턴스 일괄 적용</text>
<text x="166" y="380" font-size="13" font-weight="700" fill="#1160D8">허용 / 거부 둘 다</text>
<rect x="490" y="328" width="434" height="72" fill="#FFFFFF" stroke="#79CDFF"/><rect x="490" y="328" width="6" height="72" fill="#79CDFF"/>
<text x="512" y="369" font-size="15" font-weight="700" fill="#123249">보안 그룹(SG)</text>
<text x="620" y="357" font-size="13" fill="#35526A">인스턴스(ALB, EC2) 단위</text>
<text x="620" y="380" font-size="13" font-weight="700" fill="#1160D8">허용만 가능</text>
</g>
</svg>
