<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="The VPC on one page: under the IGW, the public subnet holds the ALB, NAT gateway and bastion host; the private subnet holds the app server, internal ALB, RDS, ElastiCache, EFS and an interface endpoint that leads to S3 outside the VPC">
