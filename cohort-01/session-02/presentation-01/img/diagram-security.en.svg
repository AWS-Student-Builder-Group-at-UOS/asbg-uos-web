<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" role="img" aria-label="A NACL checks incoming requests and outgoing responses against separate rules at the subnet edge; a security group in front of the instance lets responses to allowed requests through automatically">
<style>
@font-face{font-family:"d-sans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"d-sans";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.m{font-family:"d-mono","Geist Mono",ui-monospace,Menlo,Consolas,monospace}
.s{font-family:"d-sans",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
</style>
<rect width="800" height="316" fill="#FFFFFF"/>
<rect x="212" y="96" width="556" height="194" fill="#F4F6F8"/>
<text x="236" y="116" font-size="12.5" font-weight="600" fill="#8A94A0">Subnet</text>
<rect x="480" y="116" width="272" height="154" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<rect x="32" y="150" width="104" height="100" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="84" y="205.55" font-size="15" font-weight="600" fill="#0B0F17" text-anchor="middle">Internet</text>
<rect x="664" y="158" width="80" height="84" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="704" y="197.05" font-size="16" font-weight="700" fill="#0B0F17" text-anchor="middle">EC2</text>
<text x="704" y="214.8" font-size="12.5" fill="#5B6470" text-anchor="middle">instance</text>
<path d="M136 168L657.5 168" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M664 168L656.5 171.75L656.5 164.25Z" fill="#5B6470"/>
<path d="M664 232L142.5 232" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M136 232L143.5 228.25L143.5 235.75Z" fill="#5B6470"/>
<text x="146" y="160" font-size="12.5" fill="#5B6470">request</text>
<text x="146" y="250" font-size="12.5" fill="#5B6470">response</text>
<rect x="203" y="104" width="18" height="178" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="212" y="38" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">NACL</text>
<text x="212" y="58" font-size="12.5" fill="#5B6470" text-anchor="middle">per subnet, stateless</text>
<text x="212" y="76" font-size="12.5" fill="#8A94A0" text-anchor="middle">allow and deny rules</text>
<text x="232" y="160" font-size="12.5" fill="#2B323B">checked by inbound rules</text>
<text x="232" y="250" font-size="12.5" fill="#0B0F17">checked again by outbound rules</text>
<rect x="471" y="124" width="18" height="138" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
<text x="480" y="38" font-size="14.5" font-weight="700" fill="#0B0F17" text-anchor="middle">Security group</text>
<text x="480" y="58" font-size="12.5" fill="#5B6470" text-anchor="middle">per instance, stateful</text>
<text x="480" y="76" font-size="12.5" fill="#8A94A0" text-anchor="middle">allow rules only</text>
<text x="500" y="160" font-size="12.5" fill="#2B323B">checked by inbound rules</text>
<text x="500" y="250" font-size="12.5" font-weight="600" fill="#1160D8">replies pass automatically</text>
</svg>
