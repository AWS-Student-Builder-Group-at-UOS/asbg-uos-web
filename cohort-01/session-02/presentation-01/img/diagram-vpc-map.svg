<line x1="596" y1="386" x2="630" y2="386" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="784" y1="386" x2="836" y2="386" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M521 412 V440 H332 V464" fill="none" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M521 412 V440 H709 V464" fill="none" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="521" y1="412" x2="521" y2="464" stroke="#79CDFF" stroke-width="2" marker-end="url(#arrow)"/>
</g>
</svg>
