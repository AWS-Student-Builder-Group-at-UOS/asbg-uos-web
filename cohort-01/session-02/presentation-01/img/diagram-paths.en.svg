<rect x="530" y="100" width="222" height="210" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="206" y="44" font-size="13.5" font-weight="600" fill="#5B6470" text-anchor="middle">Internet</text>
<text x="290" y="44" font-size="13.5" font-weight="600" fill="#5B6470" text-anchor="middle">IGW</text>
<text x="334" y="124" font-size="13.5" font-weight="600" fill="#0B0F17">Public subnet</text>
<text x="546" y="124" font-size="13.5" font-weight="600" fill="#0B0F17">Private subnet</text>
<text x="32" y="148" font-size="14" font-weight="700" fill="#0B0F17">Inbound</text>
<text x="32" y="167" font-size="12.5" fill="#5B6470">user requests</text>
