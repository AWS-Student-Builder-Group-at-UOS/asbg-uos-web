<rect x="340" y="130" width="152" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="416" y="155.18" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">ALB</text>
<path d="M260 150L333.5 150" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M340 150L332.5 153.75L332.5 146.25Z" fill="#5B6470"/>
<path d="M492 150L559.5 150" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M566 150L558.5 153.75L558.5 146.25Z" fill="#5B6470"/>
<text x="32" y="212" font-size="14" font-weight="700" fill="#0B0F17">Outbound</text>
<text x="32" y="231" font-size="12.5" fill="#5B6470">server reaches out</text>
<rect x="152" y="194" width="108" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="206" y="219.18" font-size="14" font-weight="500" fill="#0B0F17" text-anchor="middle">Internet</text>
<rect x="340" y="194" width="152" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="416" y="219.18" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">NAT Gateway</text>
<path d="M566 214L498.5 214" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M492 214L499.5 210.25L499.5 217.75Z" fill="#5B6470"/>
