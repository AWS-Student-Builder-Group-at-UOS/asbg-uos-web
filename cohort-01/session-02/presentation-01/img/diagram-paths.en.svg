<rect x="566" y="130" width="150" height="168" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="641" y="219.55" font-size="15" font-weight="700" fill="#0B0F17" text-anchor="middle">App server</text>
<rect x="280" y="110" width="20" height="208" fill="#FFFFFF" stroke="#0B0F17" stroke-width="1.25"/>
