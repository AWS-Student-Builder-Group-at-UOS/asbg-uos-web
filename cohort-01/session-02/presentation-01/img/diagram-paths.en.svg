<rect x="340" y="258" width="152" height="40" fill="#FFFFFF" stroke="#C5CCD4" stroke-width="1"/>
<text x="416" y="283.18" font-size="14" font-weight="600" fill="#0B0F17" text-anchor="middle">Bastion Host</text>
<path d="M260 278L333.5 278" fill="none" stroke="#5B6470" stroke-width="1.5" stroke-linejoin="miter"/>
<path d="M340 278L332.5 281.75L332.5 274.25Z" fill="#5B6470"/>
