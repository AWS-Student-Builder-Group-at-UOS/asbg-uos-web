<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="VPC를 오가는 세 갈래 길: 사용자 요청은 IGW, ALB를 거쳐 App 서버로 들어오고, App 서버는 NAT Gateway와 IGW를 거쳐 인터넷으로 나가고, 관리자는 IGW와 Bastion Host를 거쳐 SSH로 App 서버에 접속한다">
